<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemax Premium | Select Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #25D366;
            --accent: #00ff88;
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Particles Layer */
        #canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* --- PREVIEW LOADING SCREEN --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: transform 1s cubic-bezier(0.87, 0, 0.13, 1), opacity 0.8s ease;
        }

        #loadnum {
            font-family: 'Orbitron', sans-serif;
            font-size: 100px;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 40px rgba(37, 211, 102, 0.6);
            margin-bottom: 10px;
        }

        .load-bar {
            width: 250px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .load-progress {
            height: 100%;
            width: 0%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transition: width 0.3s ease;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 460px;
            padding: 50px 35px;
            background: var(--card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            opacity: 0;
            transform: scale(0.9) translateY(40px);
            transition: 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        .container.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        h2 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .sub {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 35px;
        }

        /* --- NEXT LEVEL BUTTONS --- */
        .bot-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 35px;
        }

        .bot {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Button Hover Trace Effect */
        .bot:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: rgba(37, 211, 102, 0.08);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3), 0 0 15px rgba(37, 211, 102, 0.2);
        }

        .bot img {
            width: 26px;
            margin-right: 15px;
            transition: 0.3s;
        }

        .bot:hover img {
            transform: rotate(-10deg) scale(1.2);
        }

        /* --- PREMIUM DESCRIPTION BOX --- */
        .info-card {
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.1), rgba(0,0,0,0));
            border-radius: 22px;
            padding: 20px;
            border: 1px solid rgba(37, 211, 102, 0.2);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            text-align: left;
            position: relative;
        }

        .info-card::before {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 4px;
            background: var(--primary);
            border-radius: 0 5px 5px 0;
            box-shadow: 0 0 10px var(--primary);
        }

        .info-text {
            font-size: 13.5px;
            color: #d1d5db;
            line-height: 1.6;
        }

        .info-text b {
            color: var(--primary);
            text-shadow: 0 0 5px rgba(37, 211, 102, 0.3);
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 25px;
            font-size: 12px;
            color: #4b5563;
            letter-spacing: 1px;
            z-index: 5;
        }
        footer b { color: var(--primary); }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .bot { animation: slideIn 0.6s ease forwards; opacity: 0; }
        .bot:nth-child(1) { animation-delay: 0.1s; }
        .bot:nth-child(2) { animation-delay: 0.2s; }
        .bot:nth-child(3) { animation-delay: 0.3s; }

    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="loader">
    <div id="loadnum">0</div>
    <div class="load-bar"><div class="load-progress" id="progress"></div></div>
    <p style="margin-top: 20px; font-size: 12px; letter-spacing: 3px; color: #444;">SYSTEM READY</p>
</div>

<div class="container" id="main">
    <h2>Cinemax Bot</h2>
    <div class="sub">Select a server to process your request</div>

    <div class="bot-wrapper">
        <a id="bot1" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="icon">
            Main Server 01
        </a>
        <a id="bot2" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="icon">
            Cloud Server 02
        </a>
        <a id="bot3" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="icon">
            Backup Server 03
        </a>
    </div>

    <div class="info-card">
        <div class="info-text">
            💡 <b>දැනුවත් කිරීම:</b> එක් සේවාදායකයක් (Server) කාර්යබහුල නම්, කරුණාකර වෙනත් Bot එකක් භාවිතා කරන්න. සියලුම Bot මගින් එකම වේගයකින් සේවාව ලබාගත හැක.
        </div>
    </div>
</div>

<footer>
    © 2026 CINEMAX | BY <b>PEKSHA RASANJANA</b>
</footer>

<script>
    /* WhatsApp Logic (Keeping your original logic intact) */
    let params = new URLSearchParams(window.location.search);
    let cmd = params.get("cmd") || "";
    let link = params.get("link") || "";
    let message = encodeURIComponent(cmd + link);

    document.getElementById("bot1").href = "https://wa.me/94740707157?text=" + message;
    document.getElementById("bot2").href = "https://wa.me/94762320234?text=" + message;
    document.getElementById("bot3").href = "https://wa.me/94772461954?text=" + message;

    /* Slower & Premium Loader Logic */
    let progress = 0;
    let loadInterval = setInterval(() => {
        progress++;
        document.getElementById("loadnum").innerText = progress;
        document.getElementById("progress").style.width = (progress / 13 * 100) + "%";

        if(progress >= 13) {
            clearInterval(loadInterval);
            setTimeout(() => {
                const loader = document.getElementById("loader");
                loader.style.opacity = "0";
                loader.style.transform = "translateY(-100%)";
                document.getElementById("main").classList.add("show");
            }, 600);
        }
    }, 200);

    /* High-End Background Animation */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let points = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.3;
            this.size = Math.random() * 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fillStyle = "rgba(37, 211, 102, 0.4)";
            ctx.fill();
        }
    }

    function init() {
        resize();
        points = [];
        for(let i=0; i<60; i++) points.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        points.forEach(p => {
            p.update();
            p.draw();
        });
        
        // Lines
        ctx.strokeStyle = "rgba(37, 211, 102, 0.05)";
        for(let i=0; i<points.length; i++) {
            for(let j=i+1; j<points.length; j++) {
                let d = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);
                if(d < 150) {
                    ctx.beginPath();
                    ctx.moveTo(points[i].x, points[i].y);
                    ctx.lineTo(points[j].x, points[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);
    init();
    animate();
</script>

</body>
</html>
