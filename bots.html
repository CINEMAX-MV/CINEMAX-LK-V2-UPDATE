<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select WhatsApp Bot | Cinemax</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #25D366;
            --primary-glow: rgba(37, 211, 102, 0.4);
            --bg-dark: #070b14;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-dark);
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Animated Canvas Background */
        #tech-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at center, #111827 0%, #070b14 100%);
        }

        /* Improved Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #loadnum {
            font-size: 120px;
            font-weight: 800;
            color: var(--primary);
            text-shadow: 0 0 30px var(--primary-glow);
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }

        .bar-container {
            width: 280px;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            background-size: 200% 100%;
            box-shadow: 0 0 15px var(--primary);
            animation: loadbar 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes loadbar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Main Container */
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 50px 40px;
            border-radius: 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 32px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            font-size: 15px;
            opacity: 0.6;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        .bot-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 35px;
        }

        /* Professional Bot Button */
        .bot {
            position: relative;
            display: flex;
            align-items: center;
            padding: 18px 25px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 500;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .bot::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .bot:hover::before {
            left: 100%;
        }

        .bot:hover {
            background: rgba(37, 211, 102, 0.1);
            border-color: var(--primary);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.2);
        }

        .bot img {
            width: 24px;
            margin-right: 15px;
            filter: drop-shadow(0 0 5px rgba(37, 211, 102, 0.5));
        }

        /* Description Box */
        .description {
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border-left: 3px solid var(--primary);
            text-align: left;
        }

        .description b {
            color: var(--primary);
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 20px;
            font-size: 13px;
            opacity: 0.5;
            letter-spacing: 1px;
            z-index: 2;
        }

        footer b { color: var(--primary); }

        @media(max-width: 480px) {
            .container { padding: 40px 20px; }
            h2 { font-size: 26px; }
            #loadnum { font-size: 80px; }
        }
    </style>
</head>
<body>

<div id="tech-bg"><canvas id="canvas"></canvas></div>

<div id="loader">
    <div id="loadnum">0</div>
    <div class="bar-container"><div class="bar-fill"></div></div>
</div>

<div class="container" id="main">
    <h2>Choose Bot</h2>
    <div class="sub">Select a server to request your movie</div>

    <div class="bot-wrapper">
        <a id="bot1" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="WA">
            WhatsApp Server 01
        </a>
        <a id="bot2" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="WA">
            WhatsApp Server 02
        </a>
        <a id="bot3" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="WA">
            WhatsApp Server 03
        </a>
    </div>

    <div class="description">
        💡 කිසියම් හේතුවක් මත <b>Server 1</b> ක්‍රියා නොකරයි නම්, වෙනත් Bot එකක් භාවිතා කරන්න.
    </div>
</div>

<footer>
    © 2026 CINEMAX | Directed by <b>Peksha Rasanjana</b>
</footer>

<script>
    /* WhatsApp Logic (Keeping your original logic intact) */
    let params = new URLSearchParams(window.location.search);
    let cmd = params.get("cmd") || "";
    let link = params.get("link") || "";
    let message = encodeURIComponent(cmd + link);

    document.getElementById("bot1").href = "https://wa.me/94740707157?text=" + message;
    document.getElementById("bot2").href = "https://wa.me/94762320234?text=" + message;
    document.getElementById("bot3").href = "https://wa.me/94772461954?text=" + message;

    /* Enhanced Loader */
    let n = 0;
    let load = setInterval(() => {
        n += Math.floor(Math.random() * 3) + 1; 
        if(n > 13) n = 13;
        document.getElementById("loadnum").innerText = n;
        
        if(n >= 13) {
            clearInterval(load);
            setTimeout(() => {
                const loader = document.getElementById("loader");
                loader.style.opacity = "0";
                setTimeout(() => loader.style.display = "none", 500);
                
                let main = document.getElementById("main");
                main.style.opacity = 1;
                main.style.transform = "translateY(0)";
            }, 300);
        }
    }, 150);

    /* Smooth Particle Background */
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let points = [];
    const maxDist = 100;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
    }

    function init() {
        points = [];
        const count = (canvas.width * canvas.height) / 15000;
        for(let i=0; i<count; i++) {
            points.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i=0; i<points.length; i++) {
            let p = points[i];
            p.x += p.vx;
            p.y += p.vy;

            if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

            ctx.fillStyle = "rgba(37, 211, 102, 0.3)";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
            ctx.fill();

            for(let j=i+1; j<points.length; j++) {
                let q = points[j];
                let dist = Math.hypot(p.x - q.x, p.y - q.y);
                if(dist < maxDist) {
                    ctx.strokeStyle = `rgba(37, 211, 102, ${0.15 * (1 - dist/maxDist)})`;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(q.x, q.y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();
</script>

</body>
</html>
