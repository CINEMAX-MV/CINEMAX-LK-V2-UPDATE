<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemax | Select WhatsApp Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #25D366;
            --primary-dark: #128c7e;
            --accent: #00ff88;
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-dark);
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* High Quality Background */
        #tech-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- NEXT LEVEL LOADER --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* Loader එක මැකී යන විදිය පාලනය කරයි */
            transition: opacity 1s cubic-bezier(0.77, 0, 0.175, 1), transform 1s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #loadnum {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(80px, 15vw, 140px);
            font-weight: 700;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(37, 211, 102, 0.4));
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 30px;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
        }

        .bar-outer {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .bar-inner {
            height: 100%;
            width: 0%;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            transition: width 0.4s ease-out;
        }

        /* --- MAIN CONTENT --- */
        .container {
            text-align: center;
            width: 90%;
            max-width: 480px;
            position: relative;
            z-index: 2;
            opacity: 0;
            /* Reveal එකට පෙර position එක */
            transform: translateY(60px) scale(0.9);
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            padding: 50px 30px;
            border-radius: 35px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
        }

        /* පේජ් එක load වූ පසු රන් වන floating ඇනිමේෂන් එක */
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        h2 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        /* --- BOT BUTTONS --- */
        .bot-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
        }

        .bot {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.4s ease;
            overflow: hidden;
            z-index: 1;
        }

        .bot::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(37, 211, 102, 0.2), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
            z-index: -1;
        }

        .bot:hover::after {
            transform: translateX(100%);
        }

        .bot:hover {
            border-color: var(--primary);
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.2);
            background: rgba(37, 211, 102, 0.05);
        }

        .bot img {
            width: 28px;
            margin-right: 18px;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        /* Description Box */
        .description {
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #a0ffa0;
            background: rgba(37, 211, 102, 0.05);
            border: 1px dashed rgba(37, 211, 102, 0.3);
            border-radius: 20px;
            text-align: left;
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 25px;
            font-size: 13px;
            color: #64748b;
            z-index: 2;
        }
        footer b { color: var(--primary); }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @media(max-width: 480px) {
            .container { padding: 40px 20px; width: 92%; }
            h2 { font-size: 28px; }
            .bot { font-size: 16px; padding: 18px; }
        }
    </style>
</head>
<body>

<div id="tech-bg"><canvas id="canvas"></canvas></div>

<div id="loader">
    <div class="loading-text">Initializing System</div>
    <div id="loadnum">0</div>
    <div class="bar-outer">
        <div class="bar-inner" id="bar"></div>
    </div>
</div>

<div class="container" id="main">
    <h2>Select Bot</h2>
    <div class="sub">Choose an active server to start download</div>

    <div class="bot-wrapper">
        <a id="bot1" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="WA">
            WhatsApp Server 01
        </a>
        <a id="bot2" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="WA">
            WhatsApp Server 02
        </a>
        <a id="bot3" class="bot">
            <img src="https://img.icons8.com/color/48/whatsapp.png" alt="WA">
            WhatsApp Server 03
        </a>
    </div>

    <div class="description">
        ⚠️ <b>Desc:</b> කිසියම් හේතුවක් මත <b>Server 1</b> ක්‍රියා නොකරයි නම්, වෙනත් <b>server</b> එකක් භාවිතා කරන්න.
    </div>
</div>

<footer>
    © 2026 CINEMAX WEB | Directed by <b>Peksha Rasanjana</b>
</footer>

<script>
    /* Logic (Same as original) */
    let params = new URLSearchParams(window.location.search);
    let cmd = params.get("cmd") || "";
    let link = params.get("link") || "";
    let message = encodeURIComponent(cmd + link);

    document.getElementById("bot1").href = "https://wa.me/94740707157?text=" + message;
    document.getElementById("bot2").href = "https://wa.me/94762320234?text=" + message;
    document.getElementById("bot3").href = "https://wa.me/94772461954?text=" + message;

    /* Professional Slower Loader Logic */
    let count = 0;
    const target = 13;
    const duration = 3500; 
    const intervalTime = duration / target;

    let loadInterval = setInterval(() => {
        count++;
        document.getElementById("loadnum").innerText = count;
        document.getElementById("bar").style.width = (count / target * 100) + "%";

        if (count >= target) {
            clearInterval(loadInterval);
            
            // --- ENHANCED TRANSITION LOGIC ---
            setTimeout(() => {
                const loader = document.getElementById("loader");
                const main = document.getElementById("main");

                // Loader එක fade out කරමින් scale up කරයි
                loader.style.opacity = "0";
                loader.style.transform = "scale(1.2)";

                setTimeout(() => {
                    loader.style.display = "none";
                    
                    // Main Container එක Smooth ලෙස පෙන්වයි
                    main.style.opacity = "1";
                    main.style.transform = "translateY(0) scale(1)";
                    
                    // Reveal එක ඉවර වූ පසු Floating animation එක පටන් ගනී
                    setTimeout(() => {
                        main.style.animation = "floating 6s ease-in-out infinite";
                    }, 1200);
                }, 600); 
            }, 500);
        }
    }, intervalTime);

    /* High Quality Canvas Animation */
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                size: Math.random() * 2
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(37, 211, 102, 0.5)";
        ctx.strokeStyle = "rgba(37, 211, 102, 0.1)";

        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
        });
        requestAnimationFrame(draw);
    }

    window.addEventListener("resize", initCanvas);
    initCanvas();
    draw();
</script>

</body>
</html>
