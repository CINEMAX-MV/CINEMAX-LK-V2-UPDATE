<!DOCTYPE html>
<html>
<head>
  <title>AI Movie Assistant</title>

  <style>
    body{
      margin:0;
      font-family:Segoe UI, sans-serif;
      background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:white;
    }

    .container{
      max-width:500px;
      margin:auto;
      padding:15px;
    }

    .chat{
      height:70vh;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      padding:12px;
      margin:8px 0;
      border-radius:12px;
      max-width:85%;
    }

    .user{
      background:#00c6ff;
      color:black;
      margin-left:auto;
    }

    .bot{
      background:rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }

    .input-box{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      padding:12px 15px;
      border:none;
      border-radius:10px;
      background:#00c6ff;
      color:black;
      cursor:pointer;
      font-weight:bold;
    }

    .download-btn{
      display:inline-block;
      margin:6px;
      padding:10px 15px;
      border-radius:25px;
      background:linear-gradient(45deg,#00ffcc,#00c6ff);
      color:black;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .download-btn:hover{
      transform:scale(1.1);
    }

    .movie-card{
      background:rgba(255,255,255,0.08);
      padding:15px;
      border-radius:15px;
      margin-top:10px;
    }

    .poster{
      width:100%;
      max-width:220px;
      border-radius:12px;
      box-shadow:0 8px 25px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

<div class="container">

  <div class="chat" id="chat"></div>

  <div class="input-box">
    <input id="input" placeholder="Type message..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const movie = {
  title: params.get("title") || "Unknown Movie",
  link: params.get("link") || "#",
  cmd: params.get("cmd") || "download",
  image: params.get("image") || "https://via.placeholder.com/300x450",
  imdb: 8.2,
  release_date: "2024-05-10",
  director: "Unknown Director",
  runtime: "2h 10m",
  genre: "Action / Adventure / Drama",
  description: "A high-quality cinematic experience with strong story, visuals and emotion."
};

let step = 0;

function addMsg(text,type){
  document.getElementById("chat").innerHTML += 
    `<div class="msg ${type}">${text}</div>`;
  document.getElementById("chat").scrollTop = 999999;
}

// 🚀 ON LOAD
window.onload = () => {

  addMsg(`👋 හායි , මම MR.පේක්ෂ.<br>
  මම ආවෙ මේ ෆිල්ම් එක ඔයාට වට්සැප් එකෙන්ම download කරලා බලන්න උදව් වෙන්න.<br><br>
  මොකෝ කියන්නෙ ඔයා කැමතිද එහෙම 😍`,"bot");

  setTimeout(showMovie,1200);
};

// 🎬 MOVIE DETAILS (FULL UPDATED)
function showMovie(){

  addMsg(`
    <div class="movie-card">

      <h2>🎬 ${movie.title}</h2>

      <div style="display:flex;gap:15px;flex-wrap:wrap;">

        <img class="poster" src="${movie.image}">

        <div style="flex:1;min-width:200px;line-height:1.8;">
          ⭐ IMDb: ${movie.imdb}/10<br>
          📅 Release Date: ${movie.release_date}<br>
          🎬 Director: ${movie.director}<br>
          ⏳ Runtime: ${movie.runtime}<br>
          🎭 Genre: ${movie.genre}
        </div>

      </div>

      <p style="margin-top:15px;color:#ddd;line-height:1.6;">
        ${movie.description}
      </p>

    </div>
  `,"bot");

  setTimeout(()=>{
    addMsg("😏 ඔයාට මේ ෆිල්ම් එක download කරන්න ඕනෙද?","bot");
    step = 1;
  },1200);
}

// 💬 INPUT
function send(){

  let input = document.getElementById("input");
  let text = input.value.trim();
  input.value = "";

  if(!text) return;

  addMsg(text,"user");
  let msg = text.toLowerCase();

  // WHO MADE YOU
  if(msg.includes("who made you") || msg.includes("ඔයාව හැදුවේ කවුද")){
    addMsg("😞 මාව හැදුවේ පේක්ශ රසාංජන","bot");
    return;
  }

  // BLOCK ALL OTHER QUESTIONS
  if(step === 0){
    addMsg("🤐 මට මේ ප්‍රශ්න වලට උත්තර සපයන්න අවසර දීලා නෑ යාලුවා 🤐","bot");
    return;
  }

  // DOWNLOAD TRIGGER
  if(
    msg.includes("download") ||
    msg.includes("yes") ||
    msg.includes("ඔව්") ||
    msg.includes("ok") ||
    msg.includes("හා")
  ){
    showBots();
    return;
  }

  addMsg("🤐 මට මේ ප්‍රශ්න වලට උත්තර සපයන්න අවසර දීලා නෑ යාලුවා 🤐","bot");
}

// 🤖 BOT SELECTION
function showBots(){

  step = 2;

  addMsg(`
    🤖 Bot එකක් තෝරන්න:<br><br>

    <div class="download-btn" onclick="download(1)">🚀 Bot 1</div>
    <div class="download-btn" onclick="download(2)">⚡ Bot 2</div>
    <div class="download-btn" onclick="download(3)">🔥 Bot 3</div>
  `,"bot");
}

// 📥 WHATSAPP
function download(bot){

  let number = "";

  if(bot==1) number="94740273359";
  if(bot==2) number="94740707157";
  if(bot==3) number="94733333333";

  let message = encodeURIComponent(
    movie.cmd + " " + movie.link
  );

  window.location.href = `https://wa.me/${number}?text=${message}`;
}

</script>

</body>
</html>
