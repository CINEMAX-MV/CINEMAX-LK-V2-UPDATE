<!DOCTYPE html>
<html>
<head>
  <title>AI Movie Assistant</title>

  <style>
    body{
      margin:0;
      font-family:sans-serif;
      background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:white;
    }

    .container{
      max-width:500px;
      margin:auto;
      padding:10px;
    }

    .chat{
      height:70vh;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      padding:12px;
      margin:8px 0;
      border-radius:12px;
      max-width:80%;
    }

    .user{
      background:#00c6ff;
      color:black;
      margin-left:auto;
    }

    .bot{
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
    }

    input{
      width:75%;
      padding:10px;
      border:none;
      border-radius:10px;
    }

    button{
      padding:10px;
      border:none;
      border-radius:10px;
      background:#00c6ff;
      font-weight:bold;
      cursor:pointer;
    }

    .download-btn{
      display:inline-block;
      margin:6px;
      padding:10px 15px;
      border-radius:20px;
      background:linear-gradient(45deg,#00ffcc,#00c6ff);
      color:black;
      font-weight:bold;
      cursor:pointer;
    }

    img{
      width:100%;
      border-radius:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="chat" id="chat"></div>

  <input id="input" placeholder="Type message..." />
  <button onclick="send()">Send</button>

</div>

<script>

const API_KEY = "AIzaSyCowQzN2EDdBqx4XtgXBATRAt6z3YTF1yY";

const params = new URLSearchParams(window.location.search);
const title = params.get("title");
const link = params.get("link");
const cmd = params.get("cmd");

function addMsg(text,type){
  document.getElementById("chat").innerHTML += 
    `<div class="msg ${type}">${text}</div>`;
}

async function askAI(userMsg){

  let prompt = `
You are a smart movie assistant. Answer in Sinhala.

Movie: ${title}

User: ${userMsg}

If user asks about movie details, give full real details like:
- IMDb rating
- story
- year
- actors
- director
- everything

If user wants download, just say ask which bot.
`;

  let res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`,
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        contents:[{parts:[{text: prompt}]}]
      })
    }
  );

  let data = await res.json();

  return data.candidates?.[0]?.content?.parts?.[0]?.text || "Error 😢";
}

function send(){

  let input = document.getElementById("input");
  let text = input.value;
  input.value = "";

  addMsg(text,"user");

  // DOWNLOAD detect
  if(text.toLowerCase().includes("download")){
    
    setTimeout(()=>{
      addMsg(`
      🤖 ඔයාට මොන bot එකෙන්ද download කරන්න ඕනෙ?<br><br>

      <div class="download-btn" onclick="download(1)">Bot 1</div>
      <div class="download-btn" onclick="download(2)">Bot 2</div>
      <div class="download-btn" onclick="download(3)">Bot 3</div>
      `,"bot");
    },500);

    return;
  }

  // DIRECT bot select
  if(text.includes("bot 1")){
    download(1); return;
  }
  if(text.includes("bot 2")){
    download(2); return;
  }
  if(text.includes("bot 3")){
    download(3); return;
  }

  // AI response
  askAI(text).then(reply=>{
    addMsg(reply,"bot");
  });

}


function download(bot){

  let number;

  if(bot==1) number="947XXXXXXXX";
  if(bot==2) number="947YYYYYYYY";
  if(bot==3) number="947ZZZZZZZZ";

  let message = encodeURIComponent(cmd.trim() + " " + link);

  window.location.href = `https://wa.me/${number}?text=${message}`;
}

</script>

</body>
</html>
