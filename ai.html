<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cinemax Advanced Search AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #25D366; --bg-dark: #020617; --chat-bg: #0f172a; --user-msg: #1e293b; --ai-msg: #059669; }
        body { margin: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 15px 20px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(37, 211, 102, 0.2); display: flex; align-items: center; gap: 15px; }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--primary); margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .ai-msg { align-self: flex-start; background: var(--user-msg); border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.1); }
        .user-msg { align-self: flex-end; background: var(--ai-msg); border-bottom-right-radius: 2px; }
        .input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        input { flex: 1; background: #1e293b; border: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        button { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .film-card { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px; margin-top: 8px; border-left: 3px solid var(--primary); }
        .source-link { color: var(--primary); text-decoration: none; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div style="width: 10px; height: 10px; background: #25D366; border-radius: 50%; box-shadow: 0 0 10px #25D366;"></div>
    <h1>CINEMAX AI</h1>
</header>

<div id="chat-container"></div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="චිත්‍රපටයක නමක් හෝ ඕනෑම දෙයක් ලියන්න..." autocomplete="off">
    <button id="send-btn">➔</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // ආරම්භක පණිවිඩය
    window.onload = () => {
        addMessage("ආයුබෝවන්! මම Cinemax AI. මට පුළුවන් ඔබට අවශ්‍ය ඕනෑම චිත්‍රපටයක විස්තර හොයලා දෙන්න. චිත්‍රපටයේ නම මෙතන ලියන්න.", "ai-msg");
    };

    function addMessage(text, type, isHTML = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        if(isHTML) msgDiv.innerHTML = text;
        else msgDiv.innerText = text;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // සරල AI Logic එක (Greetings හඳුනා ගැනීම)
    function getSimpleResponse(input) {
        const text = input.toLowerCase();
        const greetings = ["hi", "hello", "hy", "hey", "හලෝ", "හායි", "ආයුබෝවන්"];
        
        if (greetings.some(g => text.includes(g))) {
            return "හායි! කොහොමද ඔයාට? අද අපි මොන ෆිල්ම් එක ගැනද හොයන්නේ?";
        }
        if (text.includes("කවුද") || text.includes("who are you")) {
            return "මම Cinemax AI සහායකයා. මම ඔබට අන්තර්ජාලයෙන් තොරතුරු සොයා දීමට උදව් කරනවා.";
        }
        return null; // Greeting එකක් නොවේ නම් Search කරන්න යොමු කරයි
    }

    async function searchMovieData(query) {
        // DuckDuckGo Search API භාවිතා කර තොරතුරු ලබා ගැනීම
        const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query + " movie details")}&format=json&pretty=1`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.AbstractText) {
                return {
                    title: data.Heading,
                    desc: data.AbstractText,
                    source: data.AbstractSource,
                    url: data.AbstractURL
                };
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    sendBtn.onclick = async () => {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, "user-msg");
        userInput.value = "";

        // 1. මුලින්ම Greeting එකක්දැයි බලමු
        const aiReply = getSimpleResponse(text);
        if (aiReply) {
            setTimeout(() => addMessage(aiReply, "ai-msg"), 500);
            return;
        }

        // 2. නැත්නම් Search කරමු
        addMessage("මම ඒ ගැන පරීක්ෂා කර බලන්නම්...", "ai-msg");
        const lastMsg = chatContainer.lastChild;

        const movie = await searchMovieData(text);

        if (movie) {
            lastMsg.remove(); // "පරීක්ෂා කර බලන්නම්" පණිවිඩය ඉවත් කරයි
            const htmlText = `
                <div class="film-card">
                    <b style="color:#25D366; font-size:16px;">🎬 ${movie.title}</b><br><br>
                    <span style="font-size:13px;">${movie.desc}</span><br><br>
                    <a href="${movie.url}" target="_blank" class="source-link">වැඩිදුර විස්තර (Source: ${movie.source})</a>
                </div>
            `;
            addMessage(htmlText, "ai-msg", true);
        } else {
            lastMsg.innerText = "කණගාටුයි, මට ඒ ගැන නිවැරදි විස්තරයක් හමු වුණේ නැහැ. කරුණාකර චිත්‍රපටයේ නම නිවැරදිව ටයිප් කරන්න.";
        }
    };

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendBtn.click(); });
</script>

</body>
</html>
