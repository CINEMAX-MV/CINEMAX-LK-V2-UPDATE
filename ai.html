<!DOCTYPE html>
<html>
<head>
  <title>AI Movie Assistant</title>

  <style>
    body{
      margin:0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:white;
    }

    .container{
      max-width:500px;
      margin:auto;
      padding:15px;
    }

    .chat{
      height:70vh;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      padding:12px;
      margin:8px 0;
      border-radius:12px;
      max-width:80%;
    }

    .user{
      background:#00c6ff;
      color:black;
      margin-left:auto;
    }

    .bot{
      background:rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }

    .input-box{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      padding:12px 15px;
      border:none;
      border-radius:10px;
      background:#00c6ff;
      color:black;
      cursor:pointer;
      font-weight:bold;
    }

    .movie-card{
      background:rgba(255,255,255,0.1);
      padding:15px;
      border-radius:15px;
      margin-top:10px;
    }

    .download-btn{
      display:inline-block;
      margin:5px;
      padding:10px 15px;
      border-radius:25px;
      background:linear-gradient(45deg,#00ffcc,#00c6ff);
      color:black;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .download-btn:hover{
      transform:scale(1.1);
    }

  </style>
</head>

<body>

<div class="container">

  <div class="chat" id="chat"></div>

  <div class="input-box">
    <input id="input" placeholder="Type something..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const title = params.get("title");
const link = params.get("link");
const cmd = params.get("cmd");

let step = 0;

function addMsg(text,type){
  document.getElementById("chat").innerHTML += 
    `<div class="msg ${type}">${text}</div>`;
}

function send(){
  let input = document.getElementById("input");
  let text = input.value;
  input.value = "";

  addMsg(text,"user");

  setTimeout(()=>{

    if(step === 0){

      addMsg(`
      <div class="movie-card">
        <h2>🎬 ${title}</h2>
        ⭐ IMDb: 7.2/10 <br><br>

        📖 Description:<br>
        This is a fantasy adventure movie with emotional storytelling and beautiful visuals.<br><br>

        🎭 Genre: Animation / Adventure / Drama<br>
        ⏱ Duration: 1h 34m<br>
        📅 Year: 1997<br>
      </div>
      `,"bot");

      step = 1;
    }

    else if(step === 1){
      addMsg("📥 ඔයාට මේ ෆිල්ම් එක download කරන්න ඕනෙද?", "bot");
      step = 2;
    }

    else if(step === 2){

      addMsg(`
      🤖 Bot එකක් තෝරන්න:<br><br>

      <div class="download-btn" onclick="download(1)">🚀 Bot 1</div>
      <div class="download-btn" onclick="download(2)">⚡ Bot 2</div>
      <div class="download-btn" onclick="download(3)">🔥 Bot 3</div>
      `,"bot");

      step = 3;
    }

  },700);
}


function download(bot){

  let number;

  if(bot==1) number="947XXXXXXXX";
  if(bot==2) number="947YYYYYYYY";
  if(bot==3) number="947ZZZZZZZZ";

  let message = encodeURIComponent(cmd.trim() + " " + link);

  window.location.href = `https://wa.me/${number}?text=${message}`;
}

</script>

</body>
</html>
