<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cinemax Universal Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #25D366; --bg-dark: #020617; --chat-bg: #0f172a; --user-msg: #1e293b; --ai-msg: #059669; }
        body { margin: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 15px 20px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(37, 211, 102, 0.2); display: flex; align-items: center; gap: 15px; }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--primary); margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .ai-msg { align-self: flex-start; background: var(--user-msg); border-bottom-left-radius: 2px; }
        .user-msg { align-self: flex-end; background: var(--ai-msg); border-bottom-right-radius: 2px; }
        .input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        input { flex: 1; background: #1e293b; border: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        button { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; color: white; font-weight: bold; }
        .source-link { display: block; margin-top: 5px; font-size: 11px; color: #34d399; text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <div style="width: 10px; height: 10px; background: #25D366; border-radius: 50%; box-shadow: 0 0 10px #25D366;"></div>
    <h1>CINEMAX SEARCH</h1>
</header>

<div id="chat-container"></div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="ඕනෑම දෙයක් අහන්න..." autocomplete="off">
    <button id="send-btn">➔</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    window.onload = () => {
        addMessage("හායි! මම Cinemax Search. ඔබට අවශ්‍ය ඕනෑම දෙයක් මෙතන අහන්න. මම අන්තර්ජාලය පරීක්ෂා කර ඔබට පිළිතුරු දෙන්නම්.", "ai-msg");
    };

    function addMessage(text, type, html = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        if(html) msgDiv.innerHTML = text;
        else msgDiv.innerText = text;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function searchInternet(query) {
        // DuckDuckGo API (No Key Required)
        const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&pretty=1`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.AbstractText) {
                return {
                    text: data.AbstractText,
                    source: data.AbstractSource,
                    url: data.AbstractURL
                };
            } else if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                return {
                    text: data.RelatedTopics[0].text,
                    source: "Related Info",
                    url: "#"
                };
            } else {
                return null;
            }
        } catch (e) {
            return null;
        }
    }

    sendBtn.onclick = async () => {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, "user-msg");
        userInput.value = "";

        // සෙවුම් පණිවිඩයක් පෙන්වීම
        const loadingId = "loading-" + Date.now();
        addMessage("පිළිතුර සොයමින් පවතී...", "ai-msg", false);

        const result = await searchInternet(text);

        // අවසාන පණිවිඩය යාවත්කාලීන කිරීම (ලෝඩින් පණිවිඩය ඉවත් කර)
        chatContainer.lastChild.remove();

        if (result) {
            let responseHTML = `
                <div>${result.text}</div>
                <a href="${result.url}" target="_blank" class="source-link">Source: ${result.source}</a>
            `;
            addMessage(responseHTML, "ai-msg", true);
        } else {
            // තොරතුරු නැතිනම් Google වෙත යොමු කිරීම
            let fallbackHTML = `
                <div>මට ඒ ගැන සෘජු පිළිතුරක් හමු වුණේ නැහැ. වැඩිදුර විස්තර සඳහා Google පරීක්ෂා කරන්න:</div>
                <a href="https://www.google.com/search?q=${encodeURIComponent(text)}" target="_blank" class="download-btn" style="display:inline-block; margin-top:10px; color:#25D366;">Google Search විවෘත කරන්න</a>
            `;
            addMessage(fallbackHTML, "ai-msg", true);
        }
    };

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendBtn.click(); });
</script>

</body>
</html>
