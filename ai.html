<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemax Working AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #020617; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 20px; background: #0f172a; border-bottom: 2px solid #25D366; text-align: center; font-weight: bold; color: #25D366; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 14px; }
        .ai { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #059669; align-self: flex-end; border-bottom-right-radius: 2px; }
        .input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; background: #1e293b; color: white; }
        button { background: #25D366; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .loading { font-size: 12px; color: #888; display: none; }
    </style>
</head>
<body>

<header>CINEMAX AI PRO 🤖</header>

<div id="chat-box"></div>
<div id="loading-text" style="padding-left: 20px; display: none; color: #25D366;">පිළිතුර සොයමින්...</div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="මෙතන ලියන්න..." autocomplete="off">
    <button id="send-btn">Send</button>
</div>

<script>
    // 🔴 🔴 ඔබ ලබාගත් API Key එක මෙතනට Paste කරන්න 🔴 🔴
    const API_KEY = "AIzaSyD4SlpQNUGJUHFuVgcIlZHaT9Xv2z5yurU"; 

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const loadingText = document.getElementById('loading-text');

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function callGemini(message) {
        // v1beta භාවිතා කරන්නේ Google Search පහසුකම සඳහායි
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
        
        const requestBody = {
            contents: [{ parts: [{ text: message }] }],
            // Google Search Grounding එකතු කිරීම
            tools: [{ googleSearch: {} }],
            system_instruction: {
                parts: [{ text: "You are a helpful AI. Always reply in Sinhala. Use Google Search to give latest information." }]
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            
            // API එකේ දෝෂයක් ඇත්දැයි බැලීම
            if (data.error) {
                return "Error: " + data.error.message;
            }

            return data.candidates[0].content.parts[0].text;
        } catch (err) {
            return "සම්බන්ධ වීමේ දෝෂයක්. කරුණාකර අන්තර්ජාලය සහ API Key එක පරීක්ෂා කරන්න.";
        }
    }

    sendBtn.onclick = async () => {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = "";
        loadingText.style.display = "block";

        const aiResponse = await callGemini(text);
        
        loadingText.style.display = "none";
        addMessage(aiResponse, 'ai');
    };

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendBtn.click(); });

    // ආරම්භක පණිවිඩය
    window.onload = () => addMessage("ආයුබෝවන්! මම වැඩ කරන්න සූදානම්. ඕනෑම ප්‍රශ්නයක් අහන්න.", "ai");
</script>

</body>
</html>
