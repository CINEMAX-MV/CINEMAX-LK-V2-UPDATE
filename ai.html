<!DOCTYPE html>
<html>
<head>
  <title>AI Movie Assistant</title>

  <style>
    body{
      margin:0;
      font-family:Segoe UI, sans-serif;
      background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:white;
    }

    .container{
      max-width:500px;
      margin:auto;
      padding:15px;
    }

    .chat{
      height:70vh;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      padding:12px;
      margin:8px 0;
      border-radius:12px;
      max-width:85%;
    }

    .user{
      background:#00c6ff;
      color:black;
      margin-left:auto;
    }

    .bot{
      background:rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }

    .input-box{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      padding:12px 15px;
      border:none;
      border-radius:10px;
      background:#00c6ff;
      color:black;
      cursor:pointer;
      font-weight:bold;
    }

    .movie-card{
      background:rgba(255,255,255,0.08);
      padding:15px;
      border-radius:15px;
      margin-top:10px;
    }

    .poster{
      width:100%;
      max-width:220px;
      border-radius:12px;
      box-shadow:0 8px 25px rgba(0,0,0,0.4);
    }

    .download-btn{
      display:inline-block;
      margin:6px;
      padding:10px 15px;
      border-radius:25px;
      background:linear-gradient(45deg,#00ffcc,#00c6ff);
      color:black;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="chat" id="chat"></div>

  <div class="input-box">
    <input id="input" placeholder="Type message..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>

let movies = [];
let movie = {};
let step = 0;

/* 📦 LOAD JSON */
fetch("data/movies.json")
  .then(res => res.json())
  .then(data => {
    movies = data;

    const params = new URLSearchParams(window.location.search);
    const title = params.get("title");

    movie = movies.find(m => m.title === title) || {};

    startApp();
  });

/* 🚀 START */
function startApp(){
  window.onload = () => {
    addMsg("👋 හායි, මම MR.පේක්ෂ 😎","bot");
    setTimeout(showMovie,1000);
  };
}

/* 💬 ADD MSG */
function addMsg(text,type){
  document.getElementById("chat").innerHTML += 
    `<div class="msg ${type}">${text}</div>`;
  document.getElementById("chat").scrollTop = 999999;
}

/* 🎬 SHOW MOVIE */
function showMovie(){

  addMsg(`
    <div class="movie-card">

      <h2>🎬 ${movie.title || "Movie Not Found"}</h2>

      <div style="display:flex;gap:15px;flex-wrap:wrap;">

        <img class="poster" src="${movie.image}">

        <div style="flex:1;min-width:200px;line-height:1.8;">
          ⭐ IMDb: ${movie.imdb}<br>
          📅 Release Date: ${movie.release_date}<br>
          🎬 Director: ${movie.director}<br>
          ⏳ Runtime: ${movie.runtime}<br>
          🎭 Genre: ${movie.genre}
        </div>

      </div>

      <p style="margin-top:15px;color:#ddd;">
        ${movie.description}
      </p>

    </div>
  `,"bot");

  setTimeout(()=>{
    addMsg(`
      😏 Download කරන්න ඕනෙද?<br><br>

      <div class="download-btn" onclick="showBots()">🚀 YES</div>
      <div class="download-btn" onclick="noThanks()">❌ NO</div>
    `,"bot");

    step = 1;
  },1000);
}

/* 🤖 BOT SYSTEM */
function showBots(){

  step = 2;

  addMsg(`
    🤖 Bot එකක් තෝරන්න:<br><br>

    <div class="download-btn" onclick="download(1)">🚀 Bot 1</div>
    <div class="download-btn" onclick="download(2)">⚡ Bot 2</div>
    <div class="download-btn" onclick="download(3)">🔥 Bot 3</div>
  `,"bot");
}

/* ❌ NO THANKS */
function noThanks(){
  addMsg("👍 හරි එහෙනම්, enjoy movie 😎","bot");
  step = 0;
}

/* 📥 WHATSAPP */
function download(bot){

  let number = "";

  if(bot==1) number="94740273359";
  if(bot==2) number="94740707157";
  if(bot==3) number="94733333333";

  let message = encodeURIComponent(movie.link);

  window.location.href = `https://wa.me/${number}?text=${message}`;
}

/* 💬 INPUT */
function send(){

  let input = document.getElementById("input");
  let text = input.value.trim();
  input.value = "";

  if(!text) return;

  addMsg(text,"user");

  let msg = text.toLowerCase();

  if(step === 0){
    addMsg("🤐 තව පියවරක් නැහැ","bot");
    return;
  }

  if(step === 1){
    if(msg.includes("yes") || msg.includes("ok") || msg.includes("ඔව්") || msg.includes("download")){
      showBots();
    } else {
      noThanks();
    }
    return;
  }

  addMsg("🤖 command එක තේරුණේ නෑ","bot");
}

</script>

</body>
</html>
