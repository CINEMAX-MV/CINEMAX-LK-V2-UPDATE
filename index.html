<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinemax Elite - Premium Movies & Series</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --red:#E50914;
  --bg:#080808;
  --bg2:#111111;
  --bg3:#1c1c1c;
  --bg4:#2a2a2a;
  --t1:#ffffff;
  --t2:#cccccc;
  --t3:#777777;
  --chip-bg:#161616;
  --chip-active:#ffffff;
  --chip-active-text:#000000;
  --glow: rgba(229, 9, 20, 0.4);
  --glass: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.08);
}
html,body{background:var(--bg);color:var(--t1);font-family:'Roboto',sans-serif;min-height:100vh;overflow-x:hidden;scroll-behavior: smooth;}

/* CUSTOM SCROLLBAR */
::-webkit-scrollbar {width: 8px; height: 6px;}
::-webkit-scrollbar-track {background: var(--bg);}
::-webkit-scrollbar-thumb {background: var(--bg3); border-radius: 20px;}
::-webkit-scrollbar-thumb:hover {background: var(--bg4);}

/* TOPBAR WITH GRADIENT BLEND */
.topbar{position:sticky;top:0;z-index:99;background:linear-gradient(to bottom, rgba(8,8,8,1) 40%, rgba(8,8,8,0) 100%);display:flex;align-items:center;padding:0 5%;height:75px;transition: background 0.3s;}
.tb-logo{display:flex;align-items:center;gap:8px;flex:1}
.tb-logo svg{width:40px;height:28px; filter: drop-shadow(0 0 8px var(--red));}
.tb-logo-txt{font-size:24px;font-weight:900;letter-spacing:-0.5px;color:var(--red);text-shadow: 0 0 15px rgba(229,9,20,0.4)}
.tb-icons{display:flex;align-items:center;gap:12px}
.tb-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--t1);background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)}
.tb-icon:hover{background:var(--red); border-color: transparent; transform: scale(1.05) rotate(5deg);}
.tb-icon svg{width:20px;height:20px}

/* LIVE SEARCH BAR SECTION */
.live-search-container {padding: 0 5%; margin-top: 20px;}
.live-search-wrapper {position: relative; background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; display: flex; align-items: center; padding: 0 20px; height: 54px; gap: 14px; transition: all 0.3s; box-shadow: 0 8px 24px rgba(0,0,0,0.6);}
.live-search-wrapper:focus-within {border-color: var(--red); box-shadow: 0 0 18px var(--glow); background: var(--bg);}
.live-search-wrapper svg {color: var(--t3); width: 22px; height: 22px; transition: color 0.3s;}
.live-search-wrapper:focus-within svg {color: var(--red);}
.live-search-wrapper input {background: none; border: none; outline: none; color: var(--t1); font-size: 16px; flex: 1; width: 100%; font-weight: 400;}
.live-search-wrapper input::placeholder {color: var(--t3);}

/* SEARCH OVERLAY */
.search-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(8,8,8,0.98); backdrop-filter: blur(20px);}
.search-overlay.open{display:flex;flex-direction:column}
.search-bar{display:flex;align-items:center;height:75px;padding:0 5%;gap:16px;border-bottom:1px solid var(--bg3)}
.search-back{width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t1);border-radius:50%; background: var(--glass);}
.search-back:hover{background:var(--red)}
.search-back svg{width:22px;height:22px}
.search-input-wrap{flex:1;background:var(--bg2);border-radius:30px;display:flex;align-items:center;padding:0 20px;height:50px;gap:12px;border: 1px solid var(--bg3); transition: 0.3s;}
.search-input-wrap:focus-within {border-color: var(--red); box-shadow: 0 0 15px var(--glow);}
.search-input-wrap svg{color:var(--t2);flex-shrink:0;width:20px;height:20px}
.search-input-wrap input{background:none;border:none;outline:none;color:var(--t1);font-size:16px;flex:1;width:100%}
.search-results{flex:1;overflow-y:auto;padding:20px 5%}
.sr-item{display:flex;align-items:center;gap:20px;padding:12px;cursor:pointer;border-radius:12px;transition: 0.2s; margin-bottom: 8px;}
.sr-item:hover{background:var(--bg2); transform: translateX(5px);}
.sr-icon{width:55px;height:80px;background:var(--bg3);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.4);}
.sr-icon img{width:100%;height:100%;object-fit:cover}
.sr-text{flex:1;min-width:0}
.sr-title{font-size:16px;font-weight: 700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-sub{font-size:13px;color:var(--t3);margin-top:4px}
.sr-go{color:var(--t3)}
.sr-go svg{width:20px;height:20px}

/* ULTRA PREMIUM HERO SLIDER (fixed content layout to bottom) */
.hero-slider{position:relative;height:82vh;overflow:hidden;background: #000; box-shadow: inset 0 -50px 50px var(--bg);}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s cubic-bezier(0.4, 0, 0.2, 1);display: flex; align-items: flex-end; padding-bottom: 70px;}
.hero-slide.active{opacity:1}
.hero-bg{position: absolute; top: 0; left: 0; width:100%;height:100%;object-fit:cover;filter:brightness(.45) contrast(1.1); transform: scale(1.02); transition: transform 5s ease;}
.hero-slide.active .hero-bg {transform: scale(1);}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(to top, var(--bg) 0%, rgba(8,8,8,0.4) 40%, rgba(8,8,8,0.7) 100%), linear-gradient(to right, var(--bg) 0%, transparent 70%)}
.hero-content{position:relative; padding:0 5%; z-index:2; max-width: 850px; width: 100%; animation: fadeInUp 0.8s ease-out;}
@keyframes fadeInUp { from {opacity: 0; transform: translateY(30px);} to {opacity: 1; transform: translateY(0);} }
.hero-badge{display:inline-flex; align-items: center; gap: 6px; padding:6px 14px;background:linear-gradient(45deg, var(--red), #ff333d);border-radius:6px;font-size:11px;font-weight:900;margin-bottom:18px;letter-spacing:1.5px; box-shadow: 0 4px 15px rgba(229,9,20,0.5)}
.hero-title{font-size:62px;font-weight:900;line-height:1.05;margin-bottom:18px;text-shadow:0 4px 20px rgba(0,0,0,0.9);color: #fff; letter-spacing: -1px;}
.hero-meta{display:flex;align-items:center;gap:20px;font-size:15px;color:var(--t2);margin-bottom:22px;flex-wrap:wrap;font-weight: 500;}
.hero-rating{display:flex;align-items:center;gap:6px;color:#FFD700;font-weight:700; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 6px; backdrop-filter: blur(5px);}
.hero-rating svg{width:16px;height:16px}
.hero-plot{font-size:16px;line-height:1.65;color:var(--t2);margin-bottom:32px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 8px rgba(0,0,0,0.9); max-width: 700px;}
.hero-btns{display:flex;gap:16px}
.btn-hero{padding:16px 36px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;gap:12px;transition:all .25s cubic-bezier(0.4, 0, 0.2, 1);}
.btn-play{background:var(--t1);color:#000; box-shadow: 0 4px 20px rgba(255,255,255,0.15)}
.btn-play:hover{background:#ffffff;transform:scale(1.05) translateY(-2px);box-shadow: 0 6px 25px rgba(255,255,255,0.35)}
.btn-hero svg{width:22px;height:22px}
.hero-dots{position:absolute;bottom:40px;right:5%;display:flex;gap:10px;z-index:3}
.hero-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all.4s}
.hero-dot.active{background:var(--red);width:30px;border-radius:6px; box-shadow: 0 0 10px var(--red);}

/* CATEGORY CHIPS */
.chips-wrap{overflow-x:auto;padding:25px 5% 15px;display:flex;gap:12px;scrollbar-width:none;position:sticky;top:75px;z-index:98;background:linear-gradient(to bottom, var(--bg) 80%, rgba(8,8,8,0) 100%);}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:12px 24px;border-radius:30px;background:var(--chip-bg);color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--glass-border);white-space:nowrap;transition:all 0.25s ease;display:flex;align-items:center;gap:8px}
.chip.on{background:var(--chip-active);color:var(--chip-active-text);border-color: var(--chip-active); box-shadow: 0 6px 20px rgba(255,255,255,0.2)}
.chip:hover:not(.on){background: var(--bg3); color: var(--t1); border-color: var(--t3);}

/* CARDS ROW & SCROLL */
.section{padding:0 0 20px 0;margin-top:32px; position: relative;}
.section:hover .scroll-btn {opacity: 1;}
.section-head{display:flex;align-items:center;justify-content:between;padding:0 5% 16px}
.section-title{font-size:24px;font-weight:900;letter-spacing: 0.5px; position: relative;}
.section-title::after {content: ''; position: absolute; bottom: -6px; left: 0; width: 40px; height: 3px; background: var(--red); border-radius: 2px;}

.hscroll-container {position: relative; width: 100%;}
.hscroll{display:flex;gap:20px;padding:10px 5% 25px 5%;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
.hscroll::-webkit-scrollbar{display:none}

/* HORIZONTAL CARDS */
.hcard{flex: 0 0 calc(16.666% - 17px);min-width: 180px;cursor:pointer;transition:all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);position:relative;border-radius:10px;}
.hcard:hover{transform: scale(1.08) translateY(-8px);z-index: 10;box-shadow: 0 15px 30px rgba(0,0,0,0.9), 0 0 20px var(--glow);}
.hcard-poster{width:100%;height:270px;border-radius:10px;overflow:hidden;background:var(--bg3);position:relative; box-shadow: 0 8px 20px rgba(0,0,0,0.5);}
.hcard-poster img{width:100%;height:100%;object-fit:cover; transition: transform 0.5s;}
.hcard:hover .hcard-poster img {transform: scale(1.05);}
.hcard-rating{position:absolute;top:10px;right:10px;background:rgba(8,8,8,0.85);padding:5px 9px;border-radius:6px;font-size:12px;font-weight:700;color:#FFD700;display:flex;align-items:center;gap:4px;backdrop-filter:blur(8px);border: 1px solid var(--glass-border);}
.hcard-rating svg{width:13px;height:13px}
.hcard-title{font-size:15px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:12px; padding: 0 4px;}
.hcard-year{font-size:13px;color:var(--t3);margin-top:4px; padding: 0 4px; font-weight: 500;}

/* DESKTOP SCROLL BUTTONS */
.scroll-btn {position: absolute; top: 45%; transform: translateY(-50%); width: 50px; height: 70%; background: rgba(8,8,8,0.6); border: 1px solid var(--glass-border); color: #fff; z-index: 5; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.3s; backdrop-filter: blur(12px); border-radius: 10px;}
.scroll-btn:hover {background: var(--red); color: #fff; border-color: transparent; box-shadow: 0 0 15px var(--glow);}
.scroll-btn-left {left: 15px;}
.scroll-btn-right {right: 15px;}
.scroll-btn svg {width: 26px; height: 26px;}

/* BLUR LOADING OVERLAY */
.premium-loader {
  display:none; position:fixed; inset:0; background:rgba(6,6,6,0.6); z-index:1000;
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
  align-items:center; justify-content:center; flex-direction:column; gap:20px;
  opacity: 0; transition: opacity 0.4s ease;
}
.premium-loader.show {display:flex; opacity: 1;}
.netflix-spinner { position: relative; width: 65px; height: 65px; }
.netflix-spinner div { box-sizing: border-box; display: block; position: absolute; width: 52px; height: 52px; margin: 6px; border: 4px solid var(--red); border-radius: 50%; animation: netflix-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; border-color: var(--red) transparent transparent transparent; }
.netflix-spinner div:nth-child(1) { animation-delay: -0.45s; }
.netflix-spinner div:nth-child(2) { animation-delay: -0.3s; }
.netflix-spinner div:nth-child(3) { animation-delay: -0.15s; }
@keyframes netflix-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.loader-text {color: var(--t1); font-size: 14px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); animation: pulse 1.5s infinite;}

/* DETAIL PAGE MODERN VIEW */
.detail-hero{position:relative;min-height:55vh; overflow: hidden;}
.detail-bg{width:100%;height:60vh;object-fit:cover;filter:brightness(.2) blur(12px);transform:scale(1.05)}
.detail-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 10%,var(--bg) 95%)}
.detail-content{position:relative;padding:0 5%;margin-top:-320px; display:flex;gap:50px;align-items:flex-start}
.detail-poster{width:250px;height:375px;border-radius:16px;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,0.95), 0 0 30px rgba(255,255,255,0.03);margin-bottom:20px;background:var(--bg3); flex-shrink:0;}
.detail-poster img{width:100%;height:100%;object-fit:cover}
.detail-info {flex: 1; padding-top: 20px;}
.detail-title{font-size:52px;font-weight:900;margin-bottom:16px; line-height: 1.15; letter-spacing: -1px;}
.detail-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px;font-size:15px;color:var(--t2); font-weight: 500;}
.detail-rating{display:flex;align-items:center;gap:6px;color:#FFD700;font-weight:700}
.detail-rating svg{width:18px;height:18px}
.detail-plot{font-size:16px;line-height:1.75;color:var(--t2);margin-bottom:28px; max-width: 850px;}
.detail-info-grid{display:grid;grid-template-columns:auto 1fr;gap:16px 28px;font-size:15px;margin-bottom:32px; background: var(--bg2); padding: 25px; border-radius: 12px; border: 1px solid var(--bg3); box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
.detail-label{color:var(--t3);font-weight:900; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;}
.detail-value{color:var(--t1)}
.genre-tags{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.genre-tag{padding:8px 20px;background:var(--bg3);border-radius:30px;font-size:13px;font-weight:700; color: var(--t2); border: 1px solid var(--glass-border);}
.back-btn{position:fixed;top:95px;left:5%;z-index:98;width:48px;height:48px;background:rgba(8,8,8,.8);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--glass-border);color:var(--t1);backdrop-filter:blur(15px); transition: all 0.25s;}
.back-btn:hover{background:var(--red); border-color: transparent; transform: scale(1.1) rotate(-5deg); box-shadow: 0 0 15px var(--glow);}
.back-btn svg{width:24px;height:24px}

/* SUBS PREMIUM SECTION */
.subs-section{padding:40px 5% 20px}
.subs-title{font-size:24px;font-weight:900;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.subs-title svg{width:26px;height:26px;color:var(--red)}
.subs-season-tabs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-bottom:24px;padding-bottom:6px}
.subs-season-tabs::-webkit-scrollbar{display:none}
.season-tab{flex-shrink:0;padding:12px 24px;border-radius:8px;background:var(--bg3);color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--glass-border);transition:all.2s}
.season-tab.on{background:var(--red);color:#fff; border-color: transparent; box-shadow: 0 6px 15px rgba(229,9,20,0.3)}
.subs-list{display:flex;flex-direction:column;gap:12px}
.sub-card{background:var(--bg2);border-radius:12px;padding:20px 24px;display:flex;align-items:center;gap:20px;border:1px solid var(--bg3); box-shadow: 0 6px 18px rgba(0,0,0,0.2); transition: all 0.25s;}
.sub-card:hover {border-color: var(--bg4); transform: translateY(-2px); background: #151515;}
.sub-flag{font-size:28px;flex-shrink:0}
.sub-info{flex:1;min-width:0}
.sub-name{font-size:16px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-meta{font-size:13px;color:var(--t3);margin-top:8px;display:flex;gap:10px;align-items:center; flex-wrap: wrap;}
.sub-badge{background:var(--bg3);padding:4px 12px;border-radius:6px;font-size:12px;color:var(--t2); font-weight: 500; border: 1px solid var(--glass-border);}
.sub-dl-btn{flex-shrink:0;padding:12px 24px;background:var(--t1);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none;transition: 0.2s;}
.sub-dl-btn:hover{background:var(--red); color: #fff; transform: scale(1.03); box-shadow: 0 5px 15px var(--glow);}
.sub-dl-btn svg{width:16px;height:16px}

/* SPINNER & MESSAGES */
.spinner{width:40px;height:40px;border:4px solid var(--bg3);border-top-color:var(--red);border-radius:50%;animation:spin.8s linear infinite;margin:0 auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}

/* BOTTOM ULTRA GLASS NAV */
.bnav{position:fixed;bottom:20px;left:50%;transform: translateX(-50%);width:90%; max-width: 500px; background:rgba(20,20,20,0.75);border:1px solid var(--glass-border);border-radius:40px;display:flex;z-index:97;padding:6px; backdrop-filter: blur(20px); box-shadow: 0 15px 35px rgba(0,0,0,0.6);}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0;cursor:pointer;color:var(--t3);text-decoration:none; border-radius: 30px; transition: all 0.3s;}
.bn.on{color:var(--t1); background: var(--glass);}
.bn:hover {color: var(--t2);}
.bn svg{width:22px;height:22px;margin-bottom:3px}
.bn span{font-size:11px;font-weight:700; letter-spacing: 0.5px;}
.pb{height:110px}

/* RESPONSIVE BREAKPOINTS */
@media(max-width:1400px){ .hcard{flex: 0 0 calc(20% - 16px);} }
@media(max-width:1100px){ .hcard{flex: 0 0 calc(25% - 15px);} }
@media(max-width:768px){
  .topbar {height: 68px; padding: 0 6%;}
  .hero-slider {height: 65vh;}
  .hero-title{font-size:42px}
  .hero-plot{font-size: 14px;}
  .hcard{flex: 0 0 calc(33.333% - 14px); min-width: 150px;}
  .hcard-poster {height: 220px;}
  .detail-content{flex-direction: column; align-items: center; margin-top: -200px; text-align: center; gap:30px;}
  .detail-info-grid {text-align: left;}
  .detail-title {font-size: 34px;}
  .back-btn {top: 85px; left: 6%;}
  .scroll-btn {display: none;}
  .bnav {bottom: 15px; width: 92%;}
}
@media(max-width:480px){
  .hero-slider {height: 580px;}
  .hero-title {font-size: 36px;}
  .hcard{flex: 0 0 calc(50% - 10px); min-width: 135px;}
  .hcard-poster {height: 200px;}
  .hero-btns {width: 100%;}
  .btn-hero {flex: 1; justify-content: center; padding: 14px 16px; font-size: 15px;}
  .detail-poster {width: 190px; height: 285px;}
}
</style>
</head>
<body>

<div class="premium-loader" id="premiumLoader">
  <div class="netflix-spinner">
    <div></div><div></div><div></div><div></div>
  </div>
  <div class="loader-text">CINEMAX ELITE...</div>
</div>

<div class="topbar">
  <div class="tb-logo">
    <svg viewBox="0 0 34 24" fill="none">
      <rect width="34" height="24" rx="5" fill="#E50914"/>
      <path d="M13.5 7.5l8 4.5-8 4.5V7.5z" fill="white"/>
    </svg>
    <span class="tb-logo-txt">CINEMAX</span>
  </div>
  <div class="tb-icons">
    <div class="tb-icon" onclick="openSearch()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35"/></svg>
    </div>
  </div>
</div>

<div class="search-overlay" id="searchOverlay">
  <div class="search-bar">
    <div class="search-back" onclick="closeSearch()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
    </div>
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search movies, TV series from cloud..." onkeypress="if(event.key==='Enter')handleSearch(this.value)">
    </div>
  </div>
  <div class="search-results" id="searchResults">
    <div style="padding:40px 16px;text-align:center;color:var(--t3);font-size:14px">Search for movies or TV series</div>
  </div>
</div>

<div id="page-home">
  <div class="hero-slider" id="heroSlider">
    <div style="height:100%;display:flex;align-items:center;justify-content:center">
      <div class="spinner"></div>
    </div>
  </div>

  <div class="chips-wrap">
    <button class="chip on" onclick="filterCategory('all',this)">🔥 Trending</button>
    <button class="chip" onclick="filterCategory('hollywood',this)">🎬 Hollywood</button>
    <button class="chip" onclick="filterCategory('kdrama',this)">🇰🇷 K-Drama</button>
    <button class="chip" onclick="filterCategory('bollywood',this)">🇮🇳 Bollywood</button>
    <button class="chip" onclick="filterCategory('sinhala',this)">🇱🇰 Sinhala</button>

<script>
const OMDB_KEY = '35d0198a';
const SUBDL_KEY = 'subdl_Rwmf--bQfVdu54oCADQtIRslcr7tu4xHOg6wGNnZImI';
const OPENSUB_API_KEY = 'jS8TPEUJmATWzOh4BGA2K9pnMvS0I3d7';

const HERO_SERIES = [
  {id:'tt11198330',title:'House of the Dragon',year:'2022',rating:'8.5'},
  {id:'tt9813792',title:'From',year:'2022',rating:'7.8'},
  {id:'tt13443470',title:'Wednesday',year:'2022',rating:'8.1'},
  {id:'tt10919420',title:'Squid Game',year:'2021',rating:'8.0'},
  {id:'tt4574334',title:'Stranger Things',year:'2016',rating:'8.7'},
  {id:'tt0903747',title:'Breaking Bad',year:'2008',rating:'9.5'}
];

const CATEGORIES = {
  trending: ['tt11198330','tt9813792','tt13443470','tt10919420','tt4574334','tt0903747','tt8111088','tt3032476','tt0386676','tt0944947','tt0108778','tt2560140'],
  hollywood: ['tt0111161','tt1375666','tt0816692','tt0468569','tt0137523','tt0109830','tt0120737','tt0167260','tt4154796','tt7286456','tt15398776','tt9362722'],
  kdrama: ['tt15266542','tt14689414','tt13370348','tt11280740','tt10262630','tt13443470','tt11198330','tt1190634','tt10850932','tt11212276'],
  bollywood: ['tt8178634','tt15327088','tt12735488','tt1187043','tt12844910','tt10648342','tt0451850','tt0816442','tt0066763','tt0347304'],
  sinhala: ['tt2386490','tt0111161','tt1375666','tt0816692','tt0468569','tt0137523']
};

const LANG_MAP = {
  'en': {flag:'🇬🇧', name:'English'}, 'si': {flag:'🇱🇰', name:'Sinhala'}, 'ta': {flag:'🇱🇰', name:'Tamil'},
  'ko': {flag:'🇰🇷', name:'Korean'}, 'hi': {flag:'🇮🇳', name:'Hindi'}, 'fr': {flag:'🇫🇷', name:'French'},
  'de': {flag:'🇩🇪', name:'German'}, 'es': {flag:'🇪🇸', name:'Spanish'}, 'pt': {flag:'🇵🇹', name:'Portuguese'},
  'ar': {flag:'🇸🇦', name:'Arabic'}, 'zh': {flag:'🇨🇳', name:'Chinese'}, 'ja': {flag:'🇯🇵', name:'Japanese'},
  'tr': {flag:'🇹🇷', name:'Turkish'}, 'ru': {flag:'🇷🇺', name:'Russian'}, 'it': {flag:'🇮🇹', name:'Italian'}
};

function getLang(code) {
  const c = (code || '').toLowerCase();
  return LANG_MAP[c] || {flag:'🌐', name: code || 'Unknown'};
}

let currentHeroSlide = 0;
let heroInterval;

async function fetchOMDb(imdbID) {
  try {
    const res = await fetch(`https://www.omdbapi.com/?i=${imdbID}&apikey=${OMDB_KEY}&plot=full`);
    if (!res.ok) throw new Error('Network error');
    const data = await res.json();
    return data.Response === 'True'? data : null;
  } catch(e) { return null; }
}

function scrollRow(rowId, direction) {
  const row = document.getElementById(rowId);
  if (row) {
    const scrollAmount = row.clientWidth * 0.75 * direction;
    row.scrollBy({ left: scrollAmount, behavior: 'smooth' });
  }
}

function filterMoviesOnPage(query) {
  const q = query.toLowerCase().trim();
  const cards = document.querySelectorAll('.hcard');
  cards.forEach(card => {
    const title = card.querySelector('.hcard-title').innerText.toLowerCase();
    card.style.display = title.includes(q) ? 'block' : 'none';
  });
}

function togglePremiumLoader(show) {
  const loader = document.getElementById('premiumLoader');
  if (loader) loader.classList.toggle('show', show);
}

async function fetchSubDL(imdbID, season = null, episode = null) {
  try {
    let url = `https://api.subdl.com/api/v1/subtitles?api_key=${SUBDL_KEY}&imdb_id=${imdbID}&subs_per_page=30&languages=en,si,ta,hi,ko`;
    if (season!== null) url += `&season_number=${season}`;
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    return await res.json();
  } catch(e) { return { subtitles: [] }; }
}

async function fetchSubDLByTitle(title, year, season = null) {
  try {
    let url = `https://api.subdl.com/api/v1/subtitles?api_key=${SUBDL_KEY}&film_name=${encodeURIComponent(title)}&subs_per_page=30&languages=en,si,ta,hi`;
    if (year) url += `&year=${year}`;
    if (season!== null) url += `&season_number=${season}`;
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    return await res.json();
  } catch(e) { return { subtitles: [] }; }
}

async function fetchOpenSubs(imdbID, season = null, episode = null) {
  try {
    let url = `https://api.opensubtitles.com/api/v1/subtitles?imdb_id=${imdbID.replace('tt','')}&languages=en,si,ta,hi`;
    if (season!== null) url += `&season_number=${season}`;
    const res = await fetch(url, { headers: { 'Api-Key': OPENSUB_API_KEY, 'Content-Type': 'application/json' } });
    if (!res.ok) return { subtitles: [] };
    const data = await res.json();
    return {
      subtitles: data.data?.map(item => ({
        lang: item.attributes.language, release_name: item.attributes.release || item.attributes.files[0]?.file_name || 'Subtitle',
        url: item.attributes.url, author: item.attributes.uploader?.name || ''
      })) || []
    };
  } catch(e) { return { subtitles: [] }; }
}

let _currentSubsData = {}; let _currentSubsTitle = ''; let _currentSubsType = 'movie'; let _currentSubsYear = '';

async function buildSubtitlesSection(movieData) {
  const isSeriesType = movieData.Type === 'series';
  const imdbID = movieData.imdbID;
  _currentSubsTitle = movieData.Title; _currentSubsType = movieData.Type; _currentSubsYear = movieData.Year? movieData.Year.split('–')[0] : ''; _currentSubsData = {};

  const container = document.getElementById('subs-container');
  if (!container) return;
  container.innerHTML = `<div class="subs-loading"><div class="spinner"></div></div>`;

  if (isSeriesType) {
    const totalSeasons = parseInt(movieData.totalSeasons) || 1;
    await buildSeriesSubtitles(imdbID, _currentSubsTitle, _currentSubsYear, totalSeasons, container);
  } else {
    await buildMovieSubtitles(imdbID, _currentSubsTitle, _currentSubsYear, container);
  }
}

async function buildMovieSubtitles(imdbID, title, year, container) {
  let result = await fetchSubDL(imdbID);
  let subs = result && Array.isArray(result.subtitles)? result.subtitles : [];
  if (subs.length === 0) {
    const fb = await fetchSubDLByTitle(title, year);
    subs = fb && Array.isArray(fb.subtitles)? fb.subtitles : [];
  }
  if (subs.length === 0) {
    const os = await fetchOpenSubs(imdbID);
    subs = os && Array.isArray(os.subtitles)? os.subtitles : [];
  }
  if (subs.length === 0) {
    container.innerHTML = renderSubsEmpty('No subtitles found for this movie.');
    return;
  }
  container.innerHTML = `<div class="subs-list">${subs.map(s => renderSubCard(s)).join('')}</div>`;
}

async function buildSeriesSubtitles(imdbID, title, year, totalSeasons, container) {
  const seasons = [];
  for (let i = 1; i <= Math.min(totalSeasons, 15); i++) seasons.push(i);
  const tabsHTML = seasons.map((s, i) => `<button class="season-tab ${i === 0? 'on' : ''}" onclick="switchSeasonTab(${s}, this)" id="stab-${s}">Season ${s}</button>`).join('');
  container.innerHTML = `<div class="subs-season-tabs">${tabsHTML}</div><div id="subs-season-content"><div class="subs-loading"><div class="spinner"></div></div></div>`;
  await loadSeasonSubs(imdbID, title, year, 1);
}

async function loadSeasonSubs(imdbID, title, year, season) {
  const content = document.getElementById('subs-season-content');
  if (!content) return;
  if (_currentSubsData[season]) { renderSeasonContent(season, content); return; }
  content.innerHTML = `<div class="subs-loading"><div class="spinner"></div></div>`;

  let result = await fetchSubDL(imdbID, season);
  let subs = result && Array.isArray(result.subtitles)? result.subtitles : [];
  if (subs.length === 0) {
    const fb = await fetchSubDLByTitle(title, year, season);
    subs = fb && Array.isArray(fb.subtitles)? fb.subtitles : [];
  }
  if (subs.length === 0) {
    const os = await fetchOpenSubs(imdbID, season);
    subs = os && Array.isArray(os.subtitles)? os.subtitles : [];
  }
  _currentSubsData[season] = subs;
  renderSeasonContent(season, content);
}

function renderSeasonContent(season, content) {
  const subs = _currentSubsData[season] || [];
  if (subs.length === 0) { content.innerHTML = renderSubsEmpty(`No subtitles found for Season ${season}.`); return; }
  content.innerHTML = `<div class="subs-list">${subs.map(s => renderSubCard(s, season)).join('')}</div>`;
}

window.switchSeasonTab = async function(season, el) {
  document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  const dp = document.getElementById('page-detail');
  await loadSeasonSubs(dp? dp.dataset.imdbid : '', _currentSubsTitle, _currentSubsYear, season);
};

function renderSubCard(s, season) {
  const lang = getLang(s.lang || s.language);
  const dlUrl = s.url? (s.url.startsWith('http')? s.url : `https://dl.subdl.com${s.url}`) : '#';
  return `
    <div class="sub-card">
      <div class="sub-flag">${lang.flag}</div>
      <div class="sub-info">
        <div class="sub-name">${s.release_name || 'Subtitle File'}</div>
        <div class="sub-meta">
          <span>${lang.name}</span>
          ${s.author? `<span class="sub-badge">👤 ${s.author}</span>` : ''}
          ${season? `<span class="sub-badge">Season ${season}</span>` : ''}
        </div>
      </div>
      <a class="sub-dl-btn" href="${dlUrl}" target="_blank" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download
      </a>
    </div>
  `;
}

function renderSubsEmpty(msg) {
  return `<div class="subs-empty"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:40px; opacity:0.3; margin-bottom:10px;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-4 2 2.5 2-3 3 4.5"/></svg></div><div>${msg}</div></div>`;
}

async function buildHeroSlider() {
  const slider = document.getElementById('heroSlider');
  if (!slider) return;
  try {
    const slides = await Promise.all(HERO_SERIES.map(id => fetchOMDb(id.id)));
    const validSlides = slides.filter(s => s);
    slider.innerHTML = validSlides.map((movie, idx) => `
      <div class="hero-slide ${idx === 0? 'active' : ''}">
        <img src="${movie.Poster!== 'N/A'? movie.Poster : ''}" class="hero-bg" alt="">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <div class="hero-badge">🔥 TRENDING NOW</div>
          <h1 class="hero-title">${movie.Title}</h1>
          <div class="hero-meta">
            <span>${movie.Year}</span><span>${movie.Runtime}</span><span class="hero-rating"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>${movie.imdbRating}</span>
          </div>
          <p class="hero-plot">${movie.Plot}</p>
          <div class="hero-btns">
            <button class="btn-hero btn-play" onclick="showMovieDetail('${movie.imdbID}')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Watch Info</button>
          </div>
        </div>
      </div>
    `).join('') + `<div class="hero-dots">${validSlides.map((_, idx) => `<div class="hero-dot ${idx === 0? 'active' : ''}" onclick="goToSlide(${idx})"></div>`).join('')}</div>`;
    startHeroSlider();
  } catch(e) { slider.innerHTML = '<div class="error-msg">Failed to load Slider</div>'; }
}

function startHeroSlider() {
  if (heroInterval) clearInterval(heroInterval);
  heroInterval = setInterval(() => { currentHeroSlide = (currentHeroSlide + 1) % HERO_SERIES.length; showSlide(currentHeroSlide); }, 5000);
}
function showSlide(index) {
  const slides = document.querySelectorAll('.hero-slide'); const dots = document.querySelectorAll('.hero-dot');
  slides.forEach((s, i) => s.classList.toggle('active', i === index)); dots.forEach((d, i) => d.classList.toggle('active', i === index));
  currentHeroSlide = index;
}
function goToSlide(index) { showSlide(index); startHeroSlider(); }

async function loadCategory(category, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  try {
    const ids = CATEGORIES[category] || [];
    const movies = await Promise.all(ids.map(id => fetchOMDb(id)));
    container.innerHTML = movies.filter(m => m).map(movie => `
      <div class="hcard" onclick="showMovieDetail('${movie.imdbID}')">
        <div class="hcard-poster">
          <img src="${movie.Poster!== 'N/A'? movie.Poster : ''}" alt="" onerror="this.nextElementSibling.style.display='flex';this.style.display='none'">
          <div class="hcard-poster-fallback" style="display:none">🎬</div>
          <div class="hcard-rating">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>${movie.imdbRating}
          </div>
        </div>
        <div class="hcard-title">${movie.Title}</div>
        <div class="hcard-year">${movie.Year}</div>
      </div>
    `).join('');
    enableDragScroll(container);
  } catch(e) { container.innerHTML = '<div class="error-msg">Failed to load content</div>'; }
}

function enableDragScroll(el) {
  let isDown = false; let startX; let scrollLeft;
  el.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - el.offsetLeft; scrollLeft = el.scrollLeft; });
  el.addEventListener('mouseleave', () => { isDown = false; });
  el.addEventListener('mouseup', () => { isDown = false; });
  el.addEventListener('mousemove', (e) => { if(!isDown) return; e.preventDefault(); const x = e.pageX - el.offsetLeft; const walk = (x - startX) * 2; el.scrollLeft = scrollLeft - walk; });
}

function filterCategory(cat, el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); el.classList.add('on');
  const sections = ['trending', 'hollywood', 'kdrama', 'bollywood'];
  sections.forEach(s => {
    const sectionEl = document.getElementById(`sec-${s}`);
    if (sectionEl) sectionEl.style.display = (cat === 'all' || cat === s) ? 'block' : 'none';
  });
}

async function handleSearch(val) {
  const res = document.getElementById('searchResults');
  if (!val.trim()) return;
  res.innerHTML = '<div style="padding:40px; text-align:center;"><div class="spinner"></div></div>';
  try {
    const omdbRes = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(val)}&apikey=${OMDB_KEY}`);
    const omdbData = await omdbRes.json();
    if (omdbData.Response === 'True' && omdbData.Search) {
      res.innerHTML = omdbData.Search.slice(0, 15).map(m => `
        <div class="sr-item" onclick="showMovieDetail('${m.imdbID}')">
          <div class="sr-icon"><img src="${m.Poster!== 'N/A'? m.Poster : ''}" alt=""></div>
          <div class="sr-text"><div class="sr-title">${m.Title}</div><div class="sr-sub">${m.Year} · ${m.Type}</div></div>
          <div class="sr-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>
      `).join('');
    } else { res.innerHTML = '<div class="subs-empty">No results found</div>'; }
  } catch(e) { res.innerHTML = '<div class="error-msg">Search Error</div>'; }
}

async function showMovieDetail(imdbID) {
  closeSearch();
  togglePremiumLoader(true);
  const homePage = document.getElementById('page-home');
  const detailPage = document.getElementById('page-detail');
  window.scrollTo(0,0);

  const data = await fetchOMDb(imdbID);
  if (!data) { togglePremiumLoader(false); alert('Movie not found!'); return; }

  const poster = data.Poster!== 'N/A'? data.Poster : '';
  const genres = data.Genre? data.Genre.split(', ') : [];

  detailPage.innerHTML = `
    <button class="back-btn" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="detail-hero">
      <img src="${poster}" class="detail-bg" alt="">
      <div class="detail-gradient"></div>
    </div>
    <div class="detail-content">
      <div class="detail-poster"><img src="${poster}" alt=""></div>
      <div class="detail-info">
        <h1 class="detail-title">${data.Title}</h1>
        <div class="detail-meta">
          <span>${data.Year}</span><span>${data.Runtime}</span><span>${data.Rated}</span>
          <span class="detail-rating"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>${data.imdbRating}/10</span>
        </div>
        <p class="detail-plot">${data.Plot}</p>
        <div class="genre-tags">${genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
        <div class="detail-info-grid">
          <span class="detail-label">Director</span><span class="detail-value">${data.Director}</span>
          <span class="detail-label">Actors</span><span class="detail-value">${data.Actors}</span>
          <span class="detail-label">Language</span><span class="detail-value">${data.Language}</span>
        </div>
      </div>
    </div>
    <div class="subs-section">
      <div class="subs-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 12h4M6 16h8M14 12h4"/></svg> Available Subtitles</div>
      <div id="subs-container"></div>
    </div>
    <div class="pb"></div>
  `;

  detailPage.dataset.imdbid = imdbID;
  await buildSubtitlesSection(data);
  homePage.style.display = 'none';
  detailPage.style.display = 'block';
  setTimeout(() => { togglePremiumLoader(false); }, 400);
}

function openSearch() { document.getElementById('searchOverlay').classList.add('open'); setTimeout(() => document.getElementById('searchInput').focus(), 100); }
function closeSearch() { document.getElementById('searchOverlay').classList.remove('open'); }
function goHome() { document.getElementById('page-home').style.display = 'block'; document.getElementById('page-detail').style.display = 'none'; window.scrollTo(0, 0); }

  await loadCategory('kdrama', 'kdramaScroll');
  await loadCategory('bollywood', 'bollywoodScroll');
});
