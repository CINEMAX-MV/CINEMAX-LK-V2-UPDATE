<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinemax Elite - Premium Movies & Series</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --red:#E50914;
  --bg:#0f0f0f;
  --bg2:#141414;
  --bg3:#232323;
  --bg4:#333333;
  --t1:#ffffff;
  --t2:#b3b3b3;
  --t3:#7c7c7c;
  --chip-bg:#232323;
  --chip-active:#ffffff;
  --chip-active-text:#0f0f0f;
  --glow: rgba(229, 9, 20, 0.5);
}
html,body{background:var(--bg);color:var(--t1);font-family:'Roboto',sans-serif;min-height:100vh;overflow-x:hidden;scroll-behavior: smooth;}

::-webkit-scrollbar {width: 8px; height: 6px;}
::-webkit-scrollbar-track {background: var(--bg);}
::-webkit-scrollbar-thumb {background: var(--bg3); border-radius: 4px;}
::-webkit-scrollbar-thumb:hover {background: var(--bg4);}

/* TOPBAR */
.topbar{position:fixed;top:0;width:100%;z-index:100;background:linear-gradient(to bottom,rgba(15,15,15,0.9) 10%,rgba(15,15,15,0) 100%);display:flex;align-items:center;padding:0 4%;height:70px;transition: background 0.3s; backdrop-filter: blur(5px);}
.menu-btn{margin-right: 15px; cursor: pointer; color: var(--t1); display: flex; align-items: center; transition: 0.2s;}
.menu-btn:hover{color: var(--red);}
.menu-btn svg{width: 28px; height: 28px;}

.tb-logo{display:flex;align-items:center;gap:6px;flex:1}
.tb-logo svg{width:34px;height:24px}
.tb-logo-txt{font-size:24px;font-weight:900;letter-spacing:-0.5px;color:var(--red);text-shadow: 0 0 10px rgba(229,9,20,0.4)}

.tb-search{display:flex;align-items:center;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);border-radius:30px;padding:6px 16px;gap:8px;transition:0.3s; width: 250px;}
.tb-search:focus-within{border-color:var(--red);background:rgba(0,0,0,0.8); width: 300px; box-shadow: 0 0 15px rgba(229,9,20,0.3);}
.tb-search svg{color:var(--t2);width:18px;height:18px;}
.tb-search input{background:none;border:none;outline:none;color:var(--t1);font-size:14px;width:100%;}
.tb-search input::placeholder{color:var(--t3);}

/* SIDEBAR DRAWER */
.sidebar {position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--bg2); z-index: 200; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 5px 0 25px rgba(0,0,0,0.8); display: flex; flex-direction: column; padding-top: 20px;}
.sidebar.active {left: 0;}
.sidebar-overlay {display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 199; backdrop-filter: blur(3px);}
.sidebar-overlay.active {display: block;}
.sb-close {position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--t2); transition: 0.2s;}
.sb-close:hover {color: var(--red); transform: scale(1.1);}
.sb-logo {padding: 0 24px 30px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--bg3);}
.sb-logo-txt {font-size: 22px; font-weight: 900; color: var(--red);}
.sb-links {display: flex; flex-direction: column; padding: 20px 0;}
.sb-link {padding: 15px 24px; font-size: 16px; font-weight: 500; color: var(--t2); text-decoration: none; display: flex; align-items: center; gap: 15px; transition: 0.2s;}
.sb-link:hover, .sb-link.active {background: var(--bg3); color: var(--t1); border-left: 4px solid var(--red);}
.sb-link svg {width: 22px; height: 22px;}

/* HERO SLIDER - PUSHED CONTENT TO BOTTOM */
.hero-slider{position:relative;height:85vh;overflow:hidden;background: #000; margin-top: 0;}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 0.8s ease-in-out;display: flex; flex-direction: column; justify-content: flex-end;}
.hero-slide.active{opacity:1}
.hero-bg{position: absolute; top: 0; left: 0; width:100%;height:100%;object-fit:cover;filter:brightness(0.5)}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(to top, var(--bg) 0%, rgba(15,15,15,0.6) 40%, transparent 100%), linear-gradient(to right, rgba(15,15,15,0.8) 0%, transparent 70%)}
.hero-content{position:relative; padding:0 4% 60px; z-index:2; max-width: 800px; width: 100%;}
.hero-badge{display:inline-flex; align-items: center; gap: 6px; padding:6px 12px;background:var(--red);border-radius:4px;font-size:12px;font-weight:900;margin-bottom:16px;letter-spacing:1px;}
.hero-title{font-size:65px;font-weight:900;line-height:1.1;margin-bottom:12px;text-shadow:0 4px 12px rgba(0,0,0,.8);color: #fff;}
.hero-meta{display:flex;align-items:center;gap:16px;font-size:16px;color:var(--t2);margin-bottom:18px;font-weight: 500;}
.hero-rating{display:flex;align-items:center;gap:5px;color:#FFD700;font-weight:700;}
.hero-rating svg{width:18px;height:18px}
.hero-plot{font-size:17px;line-height:1.5;color:var(--t1);margin-bottom:30px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 6px rgba(0,0,0,0.9); font-weight: 400;}
.hero-btns{display:flex;gap:16px}
.btn-hero{padding:14px 32px;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;gap:10px;transition:all .2s ease;}
.btn-play{background:var(--t1);color:#000}
.btn-play:hover{background:#c0c0c0;transform:scale(1.05);}
.btn-info{background:rgba(80,80,80,0.6);color:var(--t1);backdrop-filter: blur(10px);}
.btn-info:hover{background:rgba(80,80,80,0.9);transform:scale(1.05);}
.hero-dots{position:absolute;bottom:20px;right:4%;display:flex;gap:8px;z-index:3}
.hero-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all.3s}
.hero-dot.active{background:var(--t1);width:24px;border-radius:4px}

/* CATEGORY CHIPS */
.chips-wrap{overflow-x:auto;padding:20px 4% 10px;display:flex;gap:12px;scrollbar-width:none; position:relative; z-index:10;}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:10px 22px;border-radius:30px;background:var(--chip-bg);color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,0.1);transition:all 0.2s ease;}
.chip.on{background:var(--t1);color:#000;border-color:var(--t1);}
.chip:hover:not(.on){background: var(--bg4); color: var(--t1);}

/* HORIZONTAL SCROLL CARDS */
.section{padding:0 0 20px 0;margin-top:15px; position: relative;}
.section:hover .scroll-btn {opacity: 1;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4% 12px}
.section-title{font-size:22px;font-weight:700;}
.hscroll-container {position: relative; width: 100%;}
.hscroll{display:flex;gap:14px;padding:5px 4% 20px 4%;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex: 0 0 calc(16.666% - 14px);min-width: 160px;cursor:pointer;transition:transform 0.3s ease;border-radius:8px;}
.hcard:hover{transform: scale(1.08) translateY(-5px);z-index: 10;}
.hcard-poster{width:100%;height:240px;border-radius:8px;overflow:hidden;background:var(--bg3);position:relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}
.hcard-poster img{width:100%;height:100%;object-fit:cover;}
.hcard-rating{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);padding:4px 8px;border-radius:4px;font-size:12px;font-weight:700;color:#FFD700;display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px);}
.hcard-rating svg{width:12px;height:12px}
.hcard-title{font-size:14px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:10px;}
.hcard-year{font-size:12px;color:var(--t3);margin-top:3px;}

/* SCROLL BUTTONS */
.scroll-btn {position: absolute; top: 40%; transform: translateY(-50%); width: 50px; height: 100%; background: rgba(0,0,0,0.6); border: none; color: #fff; z-index: 5; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;}
.scroll-btn:hover {background: rgba(0,0,0,0.8); color: var(--red);}
.scroll-btn-left {left: 0;}
.scroll-btn-right {right: 0;}

/* DETAIL PAGE */
.detail-hero{position:relative;min-height:50vh; overflow: hidden;}
.detail-bg{width:100%;height:60vh;object-fit:cover;filter:brightness(0.3) blur(5px);transform:scale(1.05)}
.detail-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 10%,var(--bg) 95%)}
.detail-content{position:relative;padding:0 4%;margin-top:-250px; display:flex;gap:40px;align-items:flex-start}
.detail-poster{width:250px;height:375px;border-radius:12px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,0.9);flex-shrink:0; border: 1px solid rgba(255,255,255,0.1);}
.detail-poster img{width:100%;height:100%;object-fit:cover}
.detail-info {flex: 1;}
.detail-title{font-size:48px;font-weight:900;margin-bottom:10px;}
.detail-meta{display:flex;align-items:center;gap:15px;margin-bottom:20px;font-size:15px;color:var(--t2); font-weight: 500;}
.detail-plot{font-size:16px;line-height:1.6;color:var(--t1);margin-bottom:25px; max-width: 800px; font-weight:400;}
.genre-tags{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.genre-tag{padding:6px 16px;background:rgba(255,255,255,0.1);border-radius:20px;font-size:13px;font-weight:600; color: var(--t1);}
.back-btn{position:fixed;top:20px;left:4%;z-index:98;width:45px;height:45px;background:rgba(0,0,0,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,0.2);color:var(--t1);backdrop-filter:blur(5px); transition: 0.2s;}
.back-btn:hover{background:var(--red); border-color: transparent;}

/* SUBS SECTION - PREMIUM LOOK */
.subs-section{padding:40px 4% 40px}
.subs-title{font-size:24px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.subs-title svg{width:26px;height:26px;color:var(--red)}
.subs-season-tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-bottom:25px;}
.season-tab{flex-shrink:0;padding:10px 24px;border-radius:30px;background:var(--bg3);color:var(--t1);font-size:14px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:all 0.2s}
.season-tab.on{background:var(--red);box-shadow: 0 4px 15px rgba(229,9,20,0.4);}
.subs-list{display:flex;flex-direction:column;gap:12px}
.sub-card{background:linear-gradient(90deg, rgba(35,35,35,1) 0%, rgba(20,20,20,1) 100%);border-radius:10px;padding:18px 24px;display:flex;align-items:center;gap:20px;border:1px solid rgba(255,255,255,0.05); transition: 0.3s;}
.sub-card:hover {border-color: var(--t3); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.5);}
.sub-flag{font-size:28px;}
.sub-info{flex:1;min-width:0}
.sub-name{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px;}
.sub-meta{font-size:13px;color:var(--t2);display:flex;gap:10px;align-items:center;}
.sub-badge{background:rgba(255,255,255,0.1);padding:4px 12px;border-radius:4px;font-size:12px; color:var(--t1);}
.sub-dl-btn{padding:10px 24px;background:var(--t1);color:#000;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none;transition:0.2s;}
.sub-dl-btn:hover{background:var(--red); color:#fff;}

/* LOADER */
.premium-loader {display:none; position:fixed; inset:0; background:var(--bg); z-index:1000; align-items:center; justify-content:center; flex-direction:column; gap:20px;}
.premium-loader.show {display:flex;}
.spinner{width:45px;height:45px;border:4px solid var(--bg3);border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:768px){
  .tb-search {display: none;} /* Hide search in header on mobile, use sidebar */
  .hero-slider {height: 80vh;}
  .hero-title{font-size:42px}
  .hero-plot{font-size: 15px;}
  .hero-content{padding-bottom: 40px;}
  .hcard{flex: 0 0 calc(33.333% - 10px); min-width: 130px;}
  .hcard-poster {height: 190px;}
  .detail-content{flex-direction: column; align-items: center; margin-top: -150px; text-align: center;}
  .detail-title {font-size: 36px;}
  .scroll-btn {display: none;}
}
@media(max-width:480px){
  .hero-slider {height: 75vh;}
  .hcard{flex: 0 0 calc(50% - 8px); min-width: 140px;}
  .hero-btns {flex-direction: column; width: 100%;}
  .btn-hero {justify-content: center;}
}
</style>
</head>
<body>

<div class="premium-loader" id="premiumLoader">
  <div class="spinner"></div>
</div>

<div class="topbar">
  <div class="menu-btn" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </div>
  <div class="tb-logo">
    <svg viewBox="0 0 34 24" fill="none"><rect width="34" height="24" rx="5" fill="#E50914"/><path d="M13.5 7.5l8 4.5-8 4.5V7.5z" fill="white"/></svg>
    <span class="tb-logo-txt">CINEMAX</span>
  </div>
  <div class="tb-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35"/></svg>
    <input type="text" id="mainSearchInput" placeholder="Search movies, series..." onkeypress="if(event.key==='Enter') handleSearch(this.value)">
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sb-close" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
  <div class="sb-logo">
    <svg viewBox="0 0 34 24" fill="none" width="28"><rect width="34" height="24" rx="5" fill="#E50914"/><path d="M13.5 7.5l8 4.5-8 4.5V7.5z" fill="white"/></svg>
    <span class="sb-logo-txt">CINEMAX</span>
  </div>
  <div class="sb-links">
    <a href="#" class="sb-link active" onclick="goHome(); toggleSidebar();"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Home</a>
    <a href="#" class="sb-link" onclick="focusSearch(); toggleSidebar();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Search</a>
    <a href="music.html" class="sb-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Music</a>
  </div>
</div>

<div id="page-home">
  <div class="hero-slider" id="heroSlider">
    <div style="height:100%;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>
  </div>

  <div class="chips-wrap">
    <button class="chip on" onclick="filterCategory('all',this)">🔥 Trending</button>
    <button class="chip" onclick="filterCategory('hollywood',this)">🎬 Hollywood</button>
    <button class="chip" onclick="filterCategory('kdrama',this)">🇰🇷 K-Drama</button>
    <button class="chip" onclick="filterCategory('bollywood',this)">🇮🇳 Bollywood</button>
  </div>

  <div class="section" id="sec-trending">
    <div class="section-head"><div class="section-title">Trending Series</div></div>
    <div class="hscroll-container">
      <button class="scroll-btn scroll-btn-left" onclick="scrollRow('trendingSeries', -1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="hscroll" id="trendingSeries"></div>
      <button class="scroll-btn scroll-btn-right" onclick="scrollRow('trendingSeries', 1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>

  <div class="section" id="sec-hollywood">
    <div class="section-head"><div class="section-title">Hollywood Hits</div></div>
    <div class="hscroll-container">
      <button class="scroll-btn scroll-btn-left" onclick="scrollRow('hollywoodScroll', -1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="hscroll" id="hollywoodScroll"></div>
      <button class="scroll-btn scroll-btn-right" onclick="scrollRow('hollywoodScroll', 1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
</div>

<div id="page-detail" style="display:none"></div>

<script>
const OMDB_KEY = '35d0198a';
const SUBDL_KEY = 'subdl_Rwmf--bQfVdu54oCADQtIRslcr7tu4xHOg6wGNnZImI'; 

const HERO_SERIES = [
  {id:'tt11198330',title:'House of the Dragon',year:'2022',rating:'8.5'},
  {id:'tt9813792',title:'From',year:'2022',rating:'7.8'},
  {id:'tt13443470',title:'Wednesday',year:'2022',rating:'8.1'}
];

const CATEGORIES = {
  trending: ['tt11198330','tt9813792','tt13443470','tt10919420','tt4574334','tt0903747'],
  hollywood: ['tt0111161','tt1375666','tt0816692','tt0468569','tt0137523','tt0109830']
};

let currentHeroSlide = 0;
let heroInterval;

// Sidebar Functions
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sb.classList.toggle('active');
  overlay.classList.toggle('active');
}
function focusSearch() { document.getElementById('mainSearchInput').focus(); }

async function fetchOMDb(imdbID) {
  try {
    const res = await fetch(`https://www.omdbapi.com/?i=${imdbID}&apikey=${OMDB_KEY}&plot=full`);
    const data = await res.json();
    return data.Response === 'True' ? data : null;
  } catch(e) { return null; }
}

function scrollRow(rowId, direction) {
  const row = document.getElementById(rowId);
  if(row) row.scrollBy({ left: row.clientWidth * 0.75 * direction, behavior: 'smooth' });
}

function togglePremiumLoader(show) {
  document.getElementById('premiumLoader').style.display = show ? 'flex' : 'none';
}

// Hero Slider
async function buildHeroSlider() {
  const slider = document.getElementById('heroSlider');
  const slides = await Promise.all(HERO_SERIES.map(id => fetchOMDb(id.id)));
  const valid = slides.filter(s => s);
  slider.innerHTML = valid.map((m, idx) => `
    <div class="hero-slide ${idx === 0 ? 'active' : ''}">
      <img src="${m.Poster !== 'N/A' ? m.Poster : ''}" class="hero-bg" alt="">
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-badge">TOP 10 TRENDING</div>
        <h1 class="hero-title">${m.Title}</h1>
        <div class="hero-meta">
          <span>${m.Year}</span><span>${m.Runtime}</span>
          <span class="hero-rating">★ ${m.imdbRating}</span>
        </div>
        <p class="hero-plot">${m.Plot}</p>
        <div class="hero-btns">
          <button class="btn-hero btn-play" onclick="showMovieDetail('${m.imdbID}')"><svg viewBox="0 0 24 24" fill="currentColor" width="24"><path d="M8 5v14l11-7z"/></svg> Play Now</button>
        </div>
      </div>
    </div>
  `).join('') + `<div class="hero-dots">${valid.map((_, i) => `<div class="hero-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`).join('')}</div>`;
  startHeroSlider();
}

function startHeroSlider() {
  if (heroInterval) clearInterval(heroInterval);
  heroInterval = setInterval(() => {
    currentHeroSlide = (currentHeroSlide + 1) % HERO_SERIES.length;
    showSlide(currentHeroSlide);
  }, 5000);
}
function showSlide(idx) {
  document.querySelectorAll('.hero-slide').forEach((s, i) => s.classList.toggle('active', i === idx));
  document.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  currentHeroSlide = idx;
}
function goToSlide(idx) { showSlide(idx); startHeroSlider(); }

// Categories
async function loadCategory(cat, containerId) {
  const container = document.getElementById(containerId);
  const movies = await Promise.all((CATEGORIES[cat]||[]).map(id => fetchOMDb(id)));
  container.innerHTML = movies.filter(m => m).map(m => `
    <div class="hcard" onclick="showMovieDetail('${m.imdbID}')">
      <div class="hcard-poster"><img src="${m.Poster}" alt=""></div>
      <div class="hcard-title">${m.Title}</div>
      <div class="hcard-year">${m.Year}</div>
    </div>
  `).join('');
}

function filterCategory(cat, el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); el.classList.add('on');
  ['trending', 'hollywood'].forEach(s => {
    document.getElementById(`sec-${s}`).style.display = (cat === 'all' || cat === s) ? 'block' : 'none';
  });
}

// Detail Page
async function showMovieDetail(imdbID) {
  togglePremiumLoader(true);
  const m = await fetchOMDb(imdbID);
  if (!m) { togglePremiumLoader(false); return alert('Error loading details'); }
  
  const detail = document.getElementById('page-detail');
  const isSeries = m.Type === 'series';
  const totalSeasons = parseInt(m.totalSeasons) || 1;

  detail.innerHTML = `
    <div class="back-btn" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></div>
    <div class="detail-hero"><img src="${m.Poster}" class="detail-bg" alt=""><div class="detail-gradient"></div></div>
    <div class="detail-content">
      <div class="detail-poster"><img src="${m.Poster}" alt=""></div>
      <div class="detail-info">
        <h1 class="detail-title">${m.Title}</h1>
        <div class="detail-meta"><span>${m.Year}</span><span>${m.Runtime}</span><span style="color:#FFD700; font-weight:bold;">★ ${m.imdbRating}</span></div>
        <p class="detail-plot">${m.Plot}</p>
        <div class="genre-tags">${m.Genre.split(', ').map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
      </div>
    </div>
    <div class="subs-section">
      <div class="subs-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 12h4M6 16h8M14 12h4"/></svg> Subtitles</div>
      ${isSeries ? `<div class="subs-season-tabs">${Array.from({length: Math.min(totalSeasons, 5)}, (_, i) => `<button class="season-tab ${i===0?'on':''}" onclick="switchTab(this)">Season ${i+1}</button>`).join('')}</div>` : ''}
      <div id="subs-container"><div class="spinner"></div></div>
    </div>
  `;
  
  document.getElementById('page-home').style.display = 'none';
  detail.style.display = 'block';
  window.scrollTo(0,0);
  
  // Fake Subtitle load for UI demonstration (Since API keys often fail/CORS issues)
  setTimeout(() => {
    document.getElementById('subs-container').innerHTML = `
      <div class="subs-list">
        <div class="sub-card"><div class="sub-flag">🇱🇰</div><div class="sub-info"><div class="sub-name">${m.Title} - Sinhala Subtitle</div><div class="sub-meta"><span>Sinhala</span><span class="sub-badge">Baiscope</span></div></div><a class="sub-dl-btn" href="#">Download</a></div>
        <div class="sub-card"><div class="sub-flag">🇬🇧</div><div class="sub-info"><div class="sub-name">${m.Title} - English (Web-DL)</div><div class="sub-meta"><span>English</span><span class="sub-badge">Official</span></div></div><a class="sub-dl-btn" href="#">Download</a></div>
      </div>
    `;
    togglePremiumLoader(false);
  }, 1000);
}

function switchTab(el) {
  document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
}

function goHome() {
  document.getElementById('page-home').style.display = 'block';
  document.getElementById('page-detail').style.display = 'none';
  window.scrollTo(0, 0);
}

document.addEventListener('DOMContentLoaded', async () => {
  await buildHeroSlider();
  await loadCategory('trending', 'trendingSeries');
  await loadCategory('hollywood', 'hollywoodScroll');
});
</script>
</body>
</html>
