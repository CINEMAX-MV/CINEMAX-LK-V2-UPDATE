<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinemax.lk</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --primary:#00d4ff;
    --bg:#020617;
}

body{
    margin:0;
    background:var(--bg);
    font-family:Poppins;
    color:#fff;
}

/* MENU */
.menu-btn{
    position:absolute;
    top:20px;
    left:20px;
    z-index:100;
    cursor:pointer;
}

/* HERO */
.hero-header{
    height:400px;
    background:url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80') center/cover;
    display:flex;
    align-items:end;
    padding:20px;
    position:relative;
}

.hero-header::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top,#020617,transparent);
}

.hero-content{
    position:relative;
}

/* SEARCH CENTER */
.search-area{
    display:flex;
    justify-content:center;
    margin-top:-30px;
}

.search-box{
    width:80%;
    max-width:400px;
    background:#111;
    padding:10px;
    border-radius:20px;
    display:flex;
}

/* SLIDER */
.slider{
    display:flex;
    overflow-x:auto;
    gap:15px;
    padding:20px;
}

.slide{
    min-width:250px;
}

/* LATEST */
.movies-grid{
    display:flex;
    overflow-x:auto;
    gap:15px;
    padding:20px;
}

.movie-card{
    min-width:120px;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:#000;
    transition:.3s;
    z-index:9999;
}

.sidebar.active{
    left:0;
}

.close-btn{
    position:absolute;
    right:20px;
    top:20px;
    font-size:25px;
    cursor:pointer;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    background:#000;
    padding:10px;
}
</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<header class="hero-header">
    <div class="hero-content">
        <h1 id="heroTitle">Loading...</h1>
        <button onclick="playHero()">WATCH NOW</button>
    </div>
</header>

<section class="search-area">
    <div class="search-box">
        <i class="fa fa-search"></i>
        <input placeholder="Search...">
    </div>
</section>

<!-- FEATURED -->
<div class="slider" id="movieSlider"></div>

<!-- LATEST -->
<div class="movies-grid" id="movieList"></div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
</div>

<!-- BOTTOM -->
<div class="bottom-nav">
    <div>Home</div>
    <div>Movies</div>
    <div>TV</div>
    <div>Collection</div>
</div>

<script>

// KEEP ORIGINAL FUNCTION
function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("active");
}

// ===== LOAD MOVIES =====
let allMovies = [];
let heroMovie = null;

fetch("movies.json")
.then(res=>res.json())
.then(data=>{
    allMovies = data.reverse();

    heroMovie = allMovies[0];
    document.getElementById("heroTitle").innerText = heroMovie.title;

    loadFeatured();
    loadLatest();
});

// HERO PLAY
function playHero(){
    location.href = "movie.html";
}

// FEATURED (LAST 10)
function loadFeatured(){
    let slider = document.getElementById("movieSlider");
    let last10 = allMovies.slice(0,10);

    last10.forEach((m,i)=>{
        let div=document.createElement("div");
        div.className="slide";

        div.innerHTML=`
        <img src="${m.image}" style="width:100%">
        <p>${m.title}</p>
        `;

        slider.appendChild(div);
    });

    // AUTO SCROLL
    let x=0;
    setInterval(()=>{
        x+=250;
        if(x>=slider.scrollWidth) x=0;
        slider.scrollTo({left:x,behavior:"smooth"});
    },2000);
}

// LATEST 12 + SEE ALL
function loadLatest(){
    let box = document.getElementById("movieList");
    let last12 = allMovies.slice(0,12);

    last12.forEach((m)=>{
        let d=document.createElement("div");
        d.className="movie-card";

        d.innerHTML=`
        <img src="${m.image}" style="width:100%">
        <p>${m.title}</p>
        `;
        box.appendChild(d);
    });

    let seeAll=document.createElement("div");
    seeAll.innerHTML="See All ➜";
    seeAll.onclick=()=>location.href="films.html";
    box.appendChild(seeAll);
}

</script>

</body>
</html>
