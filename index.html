<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinemax.lk</title>
<link rel="stylesheet" href="css/style.css">

<style>

/* ===== HERO ===== */
.hero-header{
height:400px;
background:
linear-gradient(to bottom, rgba(0,0,0,0) 0%, #0f0f0f 100%),
url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:0 5%;
position:relative;
}

.hero-content h1{
font-size:38px;
margin-bottom:10px;
}

.hero-content p{
color:#ccc;
font-size:16px;
}

/* ===== FEATURED SLIDER ===== */
.featured-slider{
position:relative;
width:100%;
height:420px;
overflow:hidden;
background:#000;
}

.featured-container{
display:flex;
transition:0.5s ease;
height:100%;
}

.featured-item{
min-width:100%;
height:100%;
position:relative;
display:flex;
align-items:flex-end;
padding:20px;
color:#fff;
}

.featured-item::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
z-index:1;
}

.featured-content{
position:relative;
z-index:2;
max-width:80%;
}

.featured-content h2{
font-size:26px;
margin-bottom:8px;
}

.featured-content p{
font-size:14px;
color:#ccc;
margin-bottom:10px;
}

.watch-btn{
background:#fff;
color:#000;
padding:8px 14px;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

.slide-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,0.6);
color:#fff;
border:none;
font-size:22px;
padding:8px 12px;
cursor:pointer;
z-index:3;
}

.prev{left:10px;}
.next{right:10px;}

</style>
</head>

<body>

<!-- HERO -->
<header class="hero-header">

<div class="menu-btn" onclick="toggleMenu()" style="position:absolute; left:20px; top:20px;">☰</div>

<a href="adminpanal.html" 
style="position:fixed; top:20px; right:20px; background:#87CEFA; color:white; padding:10px 15px; border-radius:8px; z-index:9999;">
Admin Panel
</a>

<div class="hero-content">
<h1>නවතම සිංහල චිත්‍රපට</h1>
<p>Download Latest Movies with Sinhala dubbed</p>

<input type="text" placeholder="Search movies..." style="padding:10px; border-radius:20px; border:none; width:250px;">

</div>
</header>

<!-- ===== FEATURED MOVIES (NEW) ===== -->
<section class="featured-slider">

<div class="featured-container" id="featuredSlider"></div>

<button class="slide-btn prev" onclick="changeSlide(-1)">❮</button>
<button class="slide-btn next" onclick="changeSlide(1)">❯</button>

</section>

<!-- MOVIE GRID -->
<section class="container">
<div id="movieList" class="movies-grid"></div>
</section>

<script>

/* ===== FEATURED SLIDER JS ===== */
let currentSlide = 0;
let featuredMovies = [];

function loadFeaturedMovies(movies){

    featuredMovies = movies.slice(-10).reverse();

    const slider = document.getElementById("featuredSlider");
    slider.innerHTML = "";

    featuredMovies.forEach(movie => {

        const item = document.createElement("div");
        item.className = "featured-item";

        item.style.background = `url('${movie.image}') center/cover no-repeat`;

        item.innerHTML = `
        <div class="featured-content">
            <h2>${movie.title} (${movie.year})</h2>
            <p>${movie.description || "No description available"}</p>
            <button class="watch-btn" onclick="alert('Open movie page')">
                WATCH NOW
            </button>
        </div>
        `;

        slider.appendChild(item);
    });
}

function changeSlide(dir){
    const slider = document.getElementById("featuredSlider");

    currentSlide += dir;

    if(currentSlide < 0) currentSlide = featuredMovies.length - 1;
    if(currentSlide >= featuredMovies.length) currentSlide = 0;

    slider.style.transform = `translateX(-${currentSlide * 100}%)`;
}

/* ===== DEMO MOVIES (ඔයාගේ movies.json එක replace වෙයි) ===== */
const movies = [
{title:"Ratatouille",year:"2007",image:"https://i.ibb.co/1YKBXpbP/gullivers-travels-poster-3.jpg",description:"Cooking story"},
{title:"Jungle Cruise",year:"2021",image:"https://i.ibb.co/1YKBXpbP/gullivers-travels-poster-3.jpg",description:"Adventure"},
{title:"Garfield",year:"2004",image:"https://i.ibb.co/1YKBXpbP/gullivers-travels-poster-3.jpg",description:"Comedy"}
];

/* ===== LOAD ===== */
loadFeaturedMovies(movies);

function toggleMenu(){
alert("Menu clicked");
}

</script>

</body>
</html>
