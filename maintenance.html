<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemax | Experience Revamping</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00bdff;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Animated Mesh Background */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 189, 255, 0.15) 0%, transparent 40%);
            animation: bgShift 15s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); }
            100% { transform: translateY(-10vh) scale(1); }
        }

        /* Main Container with Neon Border */
        .card-border {
            position: relative;
            padding: 3px;
            border-radius: 35px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% 200%;
            animation: borderRotate 4s linear infinite;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.2);
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 70px 50px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Header Animation */
        .logo-box {
            margin-bottom: 30px;
        }

        .icon-main {
            font-size: 80px;
            background: linear-gradient(to bottom, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: breath 3s ease-in-out infinite;
        }

        @keyframes breath {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        h1 {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #aaa;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Modern Progress Bar */
        .progress-box {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-fill {
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            box-shadow: 0 0 20px var(--primary);
            border-radius: 100px;
            animation: fillAnim 5s ease-in-out infinite;
        }

        @keyframes fillAnim {
            0%, 100% { width: 40%; }
            50% { width: 85%; }
        }

        /* Countdown Grid */
        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-unit {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .time-unit:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .time-unit h2 {
            font-size: 32px;
            color: var(--primary);
            font-weight: 600;
        }

        .time-unit span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
        }

        /* Action Button */
        .cta-btn {
            padding: 18px 45px;
            border-radius: 100px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
        }

        .cta-btn:hover {
            background: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.4);
        }

        footer {
            margin-top: 50px;
            font-size: 12px;
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Parallax Effect Styling */
        .parallax-target {
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div class="bg-wrapper"></div>

    <div class="card-border parallax-target" id="mainCard">
        <div class="container">
            <div class="logo-box">
                <div class="icon-main">🎬</div>
            </div>

            <h1>CINEMAX 2.0</h1>
            <p>We are upgrading our engines to provide you <br>with a <b>seamless cinematic</b> journey.</p>

            <div class="progress-box">
                <div class="progress-fill"></div>
            </div>

            <div class="countdown-grid">
                <div class="time-unit">
                    <h2 id="hrs">00</h2>
                    <span>Hours</span>
                </div>
                <div class="time-unit">
                    <h2 id="min">00</h2>
                    <span>Mins</span>
                </div>
                <div class="time-unit">
                    <h2 id="sec">00</h2>
                    <span>Secs</span>
                </div>
            </div>

            <a href="javascript:location.reload()" class="cta-btn">SYSTEM REFRESH</a>

            <footer>
                © 2026 CINEMAX PREMIUM
            </footer>
        </div>
    </div>

    <script>
        // 1. Particle Generator
        function createParticles() {
            const body = document.body;
            for(let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = p.style.height = Math.random() * 3 + 'px';
                p.style.animationDuration = (Math.random() * 10 + 10) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                body.appendChild(p);
            }
        }
        createParticles();

        // 2. Parallax Effect
        const card = document.getElementById('mainCard');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // 3. Realistic Countdown
        let countTime = 4 * 60 * 60 + 20 * 60; // 4 Hours 20 Mins

        function timer() {
            let h = Math.floor(countTime / 3600);
            let m = Math.floor((countTime % 3600) / 60);
            let s = countTime % 60;

            document.getElementById('hrs').innerText = String(h).padStart(2, '0');
            document.getElementById('min').innerText = String(m).padStart(2, '0');
            document.getElementById('sec').innerText = String(s).padStart(2, '0');

            if(countTime > 0) countTime--;
        }
        setInterval(timer, 1000);
        timer();
    </script>
</body>
</html>
